  # [[params.socialIcons]]
  # name = "github"
  # url = "https://github.com/YOURHANDLE"

[taxonomies]
tag = "tags"
series = "series"

[menus]
  [[menus.main]]
  name = "Posts"
  url = "/posts/"
  weight = 10
  [[menus.main]]
  name = "Series"
  url = "/series/"
  weight = 20
  [[menus.main]]
  name = "Tags"
  url = "/tags/"
  weight = 30
  [[menus.main]]
  name = "About"
  url = "/about/"
  weight = 40

[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
