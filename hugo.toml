[params]
description = "The full VMware Cloud Foundation stack, engineered live in a dedicated nested lab: VCF 9 bringup, NSX VPCs, VCF Automation (VM Apps and All Apps), VKS, VCF Operations, GPU workloads — real commands, real output, real failure modes, then the fix."
