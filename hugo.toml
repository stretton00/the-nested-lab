# ============================================================
# CHANGE THESE TWO WHEN YOU PICK THE NAME + DOMAIN
baseURL = "http://localhost:1313/"   # local preview only - GitHub Pages workflow passes --baseURL; set the real domain here when chosen
title   = "The Nested Lab"               # working title
# ============================================================
languageCode = "en-gb"
theme = "PaperMod"
enableRobotsTXT = true
timeZone = "Europe/London"

[pagination]
pagerSize = 10

[minify]
disableXML = true

[params]
description = "VCF platform engineering, proven live — nested labs, NSX VPCs, VCF Automation, with the receipts."
author = "Adam Stretton"
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = false
ShowCodeCopyButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowToc = true
disableSpecial1stPost = true
ShowFullTextinRSS = true
ShowWordCount = false
UseHugoToc = true
hideFooter = false

  [params.assets]
  favicon = "/favicon.svg"
  favicon16x16 = "/favicon-16.png"
  favicon32x32 = "/favicon-32.png"
  apple_touch_icon = "/apple-touch-icon.png"
  disableHLJS = true

  [params.homeInfoParams]
  Title = "The Nested Lab"
  Content = "VCF 9.x platform engineering with live receipts — nested ESXi, NSX VPCs, VCF Automation All Apps. Real commands, real output, real failure modes, then the fix."

  [[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/adam-stretton-32471943/"
  [[params.socialIcons]]
  name = "rss"
  url = "/index.xml"
  # [[params.socialIcons]]          # add when you have a public repo for the blog code
  # name = "github"
  # url = "https://github.com/YOURHANDLE"

[taxonomies]
tag = "tags"
series = "series"

[menus]
  [[menus.main]]
  name = "Posts"
  url = "/posts/"
  weight = 10
  [[menus.main]]
  name = "Series"
  url = "/series/"
  weight = 20
  [[menus.main]]
  name = "Tags"
  url = "/tags/"
  weight = 30
  [[menus.main]]
  name = "About"
  url = "/about/"
  weight = 40
  [[menus.main]]
  name = "Contact"
  url = "/contact/"
  weight = 50

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
