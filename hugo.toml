baseURL = "https://thenestedlab.com/"   # hugo server overrides this locally; Pages workflow passes its own too
title   = "The Nested Lab"
languageCode = "en-gb"
theme = "PaperMod"
enableRobotsTXT = true
timeZone = "Europe/London"

[pagination]
pagerSize = 10

[minify]
disableXML = true

[params]
description = "The full VMware Cloud Foundation stack, engineered live in a dedicated nested lab: VCF 9 bringup, NSX VPCs, VCF Automation (VM Apps and All Apps), VKS, VCF Operations, GPU workloads — real commands, real output, real failure modes, then the fix."
author = "Adam Stretton"
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = true
ShareButtons = ["linkedin"]   # Adam 1 Oct: not on X or Reddit
ShowCodeCopyButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowToc = true
disableSpecial1stPost = true
ShowFullTextinRSS = true
ShowRssButtonInSectionTermList = true   # 1 Oct 2026: an RSS button on every product, series and tag page
ShowWordCount = false
UseHugoToc = true
hideFooter = false

  [params.assets]
  favicon = "/favicon.svg"
  favicon16x16 = "/favicon-16.png"
  favicon32x32 = "/favicon-32.png"
  apple_touch_icon = "/apple-touch-icon.png"
  disableHLJS = true

  [params.homeInfoParams]
  Title = "The Nested Lab"
  Content = """
**The full VMware Cloud Foundation stack, engineered live.** Written from a nested VCF 9.x lab that the team at [Comms-care](https://www.comms-care.com/) builds and looks after — a platform where every consultant gets a complete VCF instance of their own to demo, prove and break. The standing rule: every command, every error and every fix you read here was captured from a running environment.

What gets covered — because all of it runs in the lab:

- **Foundation** — VCF 9 bringup from the Installer API, SDDC Manager, vCenter and nested ESXi, vSAN ESA, fleet components, identity.
- **Networking** — NSX and NSX VPCs: isolation, overlapping addressing, trunk subnets, transit gateways, load balancers.
- **Automation** — VCF Automation both ways: classic VM Apps (Aria templates, vRO, event broker) and supervisor-native All Apps (CCI blueprints, VM Service, the catalog).
- **Kubernetes** — VKS clusters, supervisor services, Harbor, packages, air-gapped upgrades.
- **Operations** — VCF Operations, Operations for Logs, fluent-bit, Telegraf, and metrics pipelines for things that don't have adapters (like vLLM).
- **AI infrastructure** — GPU Operator, vGPU licensing and LLM serving on VKS, including in dark sites.

New here? [Start here](/start-here/): reading paths by what you are trying to do. Or browse by product, series or month below.
"""

