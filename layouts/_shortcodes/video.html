<figure class="nl-video">
  <video autoplay loop muted playsinline controls preload="metadata" style="{{ printf "aspect-ratio:%s" (.Get "ratio" | default "16 / 9") | safeCSS }}"{{ with .Get "poster" }} poster="{{ . }}"{{ end }}>
    <source src="{{ .Get "src" }}" type="video/mp4">
  </video>
  {{ with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
