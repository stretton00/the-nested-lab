<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d">
<title id="t">VCF Automation creates the objects; the lab builds the rest</title>
<desc id="d">Five stages of one request. 1: VCF Automation creates the namespace, four subnets, three binding maps, eight disks, six VMs and the RDP address, and reports complete when the VMs are powered on. 2: cloudbase-init gives dc01 and the jump host their names, accounts and lab-config.json; from Phase 3 the jump host fetches the build and registers LabVCenterBuild. 3 (Phases 2-6): dc01 promotes itself and populates the domain; the jump host joins, reboots and, from Phase 3, waits for vcsa in dc01's DNS; marker domain-joined. 4 (Phases 3-6): LabVCenterBuild, a SYSTEM task with a 12-hour limit, prepares the hosts (Phase 3 stops there, HOSTS-READY), then builds vSAN ESA, the VCSA, the cluster, the VDS and the NFS datastore (VCENTER-READY). 5 (Phases 5-6): the AD identity source in Phase 6 (VCENTER-AD-READY) and VCF Operations with the vCenter added (OPS-READY). The binaries server supplies PowerCLI and the build script at first boot, the vCenter files, and the AD and Ops scripts and disks.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#49afd9"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8c34a"/></marker>
</defs>
<rect width="1100" height="540" fill="#1b2a32"/>
<g stroke="#34495a" stroke-width="1" opacity="0.28">
<line x1="80" y1="0" x2="80" y2="540"/><line x1="160" y1="0" x2="160" y2="540"/><line x1="240" y1="0" x2="240" y2="540"/><line x1="320" y1="0" x2="320" y2="540"/><line x1="400" y1="0" x2="400" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/><line x1="560" y1="0" x2="560" y2="540"/><line x1="640" y1="0" x2="640" y2="540"/><line x1="720" y1="0" x2="720" y2="540"/><line x1="800" y1="0" x2="800" y2="540"/><line x1="880" y1="0" x2="880" y2="540"/><line x1="960" y1="0" x2="960" y2="540"/><line x1="1040" y1="0" x2="1040" y2="540"/>
<line x1="0" y1="80" x2="1100" y2="80"/><line x1="0" y1="160" x2="1100" y2="160"/><line x1="0" y1="240" x2="1100" y2="240"/><line x1="0" y1="320" x2="1100" y2="320"/><line x1="0" y1="400" x2="1100" y2="400"/><line x1="0" y1="480" x2="1100" y2="480"/>
</g>
<text x="60" y="58" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#49afd9">ONE REQUEST, STAGE BY STAGE &#183; WHO BUILDS WHAT</text>
<text x="60" y="98" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700" fill="#e9eef2">VCF Automation creates the objects; the lab builds the rest</text>

<g font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif">
<!-- 1: VCF Automation -->
<rect x="60" y="130" width="184" height="236" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="60" y="130" width="184" height="4" rx="2" fill="#0079b8"/>
<text x="74" y="156" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="12" fill="#49afd9">1 &#183; VCF AUTOMATION</text>
<text x="74" y="182" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">Creates the lab</text>
<text x="74" y="208" font-size="13" fill="#8fa1ad">namespace, 4 subnets,</text>
<text x="74" y="227" font-size="13" fill="#8fa1ad">3 binding maps, 8 disks,</text>
<text x="74" y="246" font-size="13" fill="#8fa1ad">6 VMs and the RDP</text>
<text x="74" y="265" font-size="13" fill="#8fa1ad">address; complete when</text>
<text x="74" y="284" font-size="13" fill="#8fa1ad">the VMs are powered on</text>

<!-- 2: first boot -->
<rect x="264" y="130" width="184" height="236" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="264" y="130" width="184" height="4" rx="2" fill="#5fb84a"/>
<text x="278" y="156" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="12" fill="#49afd9">2 &#183; FIRST BOOT</text>
<text x="278" y="182" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">cloudbase-init</text>
<text x="278" y="208" font-size="13" fill="#8fa1ad">dc01 and the jump host:</text>
<text x="278" y="227" font-size="13" fill="#8fa1ad">names, accounts and</text>
<text x="278" y="246" font-size="13" fill="#8fa1ad">lab-config.json. From</text>
<text x="278" y="265" font-size="13" fill="#8fa1ad">Phase 3 the jump host</text>
<text x="278" y="284" font-size="13" fill="#8fa1ad">fetches the build and</text>
<text x="278" y="303" font-size="13" fill="#8fa1ad">registers</text>
<text x="278" y="322" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="12" fill="#49afd9">LabVCenterBuild</text>

<!-- 3: the lab domain -->
<rect x="468" y="130" width="184" height="236" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="468" y="130" width="184" height="4" rx="2" fill="#5fb84a"/>
<text x="482" y="156" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="12" fill="#49afd9">3 &#183; PHASES 2-6</text>
<text x="482" y="182" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">The lab domain</text>
<text x="482" y="208" font-size="13" fill="#8fa1ad">dc01 promotes itself,</text>
<text x="482" y="227" font-size="13" fill="#8fa1ad">reboots, adds records,</text>
<text x="482" y="246" font-size="13" fill="#8fa1ad">OUs and accounts. The</text>
<text x="482" y="265" font-size="13" fill="#8fa1ad">jump host joins, reboots,</text>
<text x="482" y="284" font-size="13" fill="#8fa1ad">then waits for vcsa in</text>
<text x="482" y="303" font-size="13" fill="#8fa1ad">dc01&#8217;s DNS (Phase 3 on)</text>
<circle cx="486" cy="330" r="3.5" fill="#5fb84a"/>
<text x="496" y="334" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#5fb84a">domain-joined</text>

<!-- 4: LabVCenterBuild -->
<rect x="672" y="130" width="184" height="236" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="672" y="130" width="184" height="4" rx="2" fill="#5fb84a"/>
<text x="686" y="156" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="12" fill="#49afd9">4 &#183; PHASES 3-6</text>
<text x="686" y="182" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">LabVCenterBuild</text>
<text x="686" y="208" font-size="13" fill="#8fa1ad">a SYSTEM task with a</text>
<text x="686" y="227" font-size="13" fill="#8fa1ad">12-hour limit: hosts</text>
<text x="686" y="246" font-size="13" fill="#8fa1ad">prepared (Phase 3 stops</text>
<text x="686" y="265" font-size="13" fill="#8fa1ad">here), vSAN ESA, the</text>
<text x="686" y="284" font-size="13" fill="#8fa1ad">VCSA, cluster, VDS and</text>
<text x="686" y="303" font-size="13" fill="#8fa1ad">the NFS datastore</text>
<circle cx="690" cy="330" r="3.5" fill="#5fb84a"/>
<text x="700" y="334" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#5fb84a">HOSTS-READY (Phase 3)</text>
<circle cx="690" cy="349" r="3.5" fill="#5fb84a"/>
<text x="700" y="353" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#5fb84a">VCENTER-READY</text>

<!-- 5: AD and VCF Operations -->
<rect x="876" y="130" width="184" height="236" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="876" y="130" width="184" height="4" rx="2" fill="#5fb84a"/>
<text x="890" y="156" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="12" fill="#49afd9">5 &#183; PHASES 5-6</text>
<text x="890" y="182" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">AD and VCF Ops</text>
<text x="890" y="208" font-size="13" fill="#8fa1ad">Phase 6: the lab domain</text>
<text x="890" y="227" font-size="13" fill="#8fa1ad">as vCenter&#8217;s identity</text>
<text x="890" y="246" font-size="13" fill="#8fa1ad">source. Phases 5 and 6:</text>
<text x="890" y="265" font-size="13" fill="#8fa1ad">VCF Operations on the</text>
<text x="890" y="284" font-size="13" fill="#8fa1ad">nested cluster, with</text>
<text x="890" y="303" font-size="13" fill="#8fa1ad">the vCenter added</text>
<circle cx="894" cy="330" r="3.5" fill="#5fb84a"/>
<text x="904" y="334" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#5fb84a">VCENTER-AD-READY</text>
<circle cx="894" cy="349" r="3.5" fill="#5fb84a"/>
<text x="904" y="353" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#5fb84a">OPS-READY</text>
</g>

<!-- stage to stage -->
<g stroke="#49afd9" stroke-width="2" fill="none" marker-end="url(#ah)">
<line x1="246" y1="248" x2="261" y2="248"/>
<line x1="450" y1="248" x2="465" y2="248"/>
<line x1="654" y1="248" x2="669" y2="248"/>
<line x1="858" y1="248" x2="873" y2="248"/>
</g>

<!-- the binaries server feeds stages 2, 4 and 5 -->
<g stroke="#e8c34a" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ay)">
<line x1="294" y1="428" x2="294" y2="370"/>
<line x1="702" y1="428" x2="702" y2="370"/>
<line x1="906" y1="428" x2="906" y2="370"/>
</g>
<g font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8fa1ad">
<text x="304" y="404">PowerCLI, build script</text>
<text x="712" y="404">vCenter files and disks</text>
<text x="916" y="404">AD and Ops scripts, disks</text>
</g>
<rect x="264" y="430" width="796" height="58" rx="8" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><rect x="264" y="430" width="796" height="4" rx="2" fill="#e8c34a"/>
<text x="278" y="456" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e9eef2">binaries server</text>
<text x="420" y="456" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e8c34a">scripts/   tools/   vcenter/&lt;build&gt;/   ops/&lt;build&gt;/</text>
<text x="278" y="477" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8fa1ad">HTTP for the jump host; the same tree as a read-only NFS datastore for the lab hosts</text>

<!-- legend -->
<circle cx="66" cy="451" r="4" fill="#5fb84a"/>
<text x="78" y="455" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8fa1ad">marker files the status</text>
<text x="78" y="474" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8fa1ad">tool reads from each lab</text>

<text x="60" y="522" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8fa1ad">A stopped step leaves a -FAILED.txt with the reason and the command to run it again; a rerun carries on from the last finished step.</text>
</svg>
