<rect x="526" y="338" width="288" height="96" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="526" y="338" width="288" height="4" rx="2" fill="#b58ad6"/>
<text x="542" y="362" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#49afd9">svc-metrics-aggregator-&#8249;id&#8250;</text>
<text x="542" y="386" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16.5" font-weight="700" fill="#e9eef2">Metrics Aggregator (9.1)</text>
<text x="542" y="407" font-size="13.5" fill="#8fa1ad">envoy &#183; its own workload-metrics LB</text>
<text x="542" y="426" font-size="13" font-weight="600" fill="#e8c34a">f06: absent 23 Aug, installed 24 Aug</text>

