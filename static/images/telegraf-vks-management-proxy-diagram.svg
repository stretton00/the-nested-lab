<line x1="0" y1="80" x2="1100" y2="80"/><line x1="0" y1="160" x2="1100" y2="160"/><line x1="0" y1="240" x2="1100" y2="240"/><line x1="0" y1="320" x2="1100" y2="320"/><line x1="0" y1="400" x2="1100" y2="400"/><line x1="0" y1="480" x2="1100" y2="480"/><line x1="0" y1="560" x2="1100" y2="560"/>
