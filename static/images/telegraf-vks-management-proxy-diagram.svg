<!-- guest: tanzu-system-telegraf -->
<rect x="56" y="290" width="408" height="104" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="56" y="290" width="408" height="4" rx="2" fill="#0079b8"/>
<text x="74" y="314" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">tanzu-system-telegraf</text>
<text x="74" y="338" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">Telegraf</text>
<text x="74" y="360" font-size="13.5" fill="#8fa1ad">3 DaemonSet pods + 1 Deployment pod, mounting</text>
<text x="74" y="380" font-size="13.5" fill="#8fa1ad">both copies &#183; values: Secret telegraf-values (package-installs)</text>

<!-- guest: default -->
<rect x="56" y="428" width="408" height="104" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="56" y="428" width="408" height="4" rx="2" fill="#0079b8"/>
<text x="74" y="452" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">default</text>
<text x="74" y="476" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#e9eef2">Service supervisor-management-proxy</text>
<text x="74" y="498" font-size="13.5" fill="#8fa1ad">headless &#183; its endpoint is the proxy&#8217;s LB, port 10093</text>
<text x="74" y="520" font-size="13.5" font-weight="600" fill="#e5605a">no serviceDomain: the name ends in &#8220;svc.&#8221; and never resolves</text>
</g>

