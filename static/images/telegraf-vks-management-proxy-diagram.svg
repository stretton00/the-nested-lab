<rect x="526" y="160" width="288" height="158" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="526" y="160" width="288" height="4" rx="2" fill="#5fb84a"/>
<text x="542" y="184" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#49afd9">svc-supervisor-management-proxy-&#8249;id&#8250;</text>
<text x="542" y="208" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16.5" font-weight="700" fill="#e9eef2">Supervisor Management Proxy</text>
<text x="542" y="230" font-size="13.5" fill="#8fa1ad">0.4.1 &#183; envoy &#183; LB on port 10093</text>
<text x="542" y="252" font-size="13.5" fill="#8fa1ad">server certificate from cert-manager:</text>
<text x="542" y="272" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#e9eef2">metrics-endpoint-downstream-server-cert</text>
