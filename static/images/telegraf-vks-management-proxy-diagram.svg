<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="t d">
<title id="t">Telegraf to the proxy to VCF Operations, and where each secret lives</title>
<desc id="d">In the VKS guest cluster demo01, the secrets metrics-proxy-tls-config and metrics-proxy-http-config appear in kube-system, each with a SecretExport, once the Supervisor Management Proxy is CONFIGURED. SecretImports copy them into tanzu-system-telegraf, where Telegraf (three DaemonSet pods and one Deployment pod, values in the Secret telegraf-values in package-installs) mounts them. Telegraf posts to the headless Service supervisor-management-proxy in default, whose endpoint is the proxy's load balancer on port 10093; without serviceDomain the name ends in svc. and never resolves. On the Supervisor, the proxy 0.4.1 runs envoy with a server certificate from cert-manager, and asks for the system VPC, where vCenter verifies what it places; the 9.1 Metrics Aggregator runs envoy with its own load balancer, absent on 23 August and added on 24 August. Dashed, from the VCF 9.1 documentation and not traced here: the aggregator hands on to the Cloud Proxy, and on to the VKS Cluster object in VCF Operations.</desc>
<defs>
