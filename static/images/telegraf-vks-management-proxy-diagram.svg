<text x="40" y="54" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#49afd9">F06 &#183; VCF 9.1 &#183; WHERE TELEGRAF&#8217;S METRICS GO AND WHERE EACH SECRET LIVES</text>
<text x="40" y="94" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700" fill="#e9eef2">Telegraf &#8594; proxy &#8594; VCF Operations, and the secrets in between</text>

