<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="630" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#49afd9" text-anchor="middle" font-weight="600" letter-spacing="3">05-build-master.ps1 &#183; RUNS EVERY BOOT</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="40" fill="#e9eef2" text-anchor="middle" font-weight="700">A state machine that survives four reboots</text><rect class="in spot" style="animation-delay:0.10s" x="60" y="230" width="200" height="110" rx="8" fill="#22343c" stroke="#8fa1ad" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="60" y="230" width="200" height="4" rx="2" fill="#8fa1ad"/><text class="in" style="animation-delay:0.10s" x="78" y="272" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">boot</text><text class="in" style="animation-delay:0.10s" x="78" y="298" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="10" fill="#8fa1ad" text-anchor="start" font-weight="400">startup task</text><line class="in flow" style="animation-delay:0.10s" x1="260" y1="285" x2="288" y2="285" stroke="#8fa1ad" stroke-width="2"/><polygon class="in" style="animation-delay:0.10s" transform="rotate(0.0 288 285)" points="288,285 279,280 279,290" fill="#8fa1ad"/><g class="in" style="animation-delay:0.10s"><circle r="4" fill="#8fa1ad"><animateMotion dur="0.90s" begin="0.10s" repeatCount="indefinite" path="M 260 285 L 288 285"/></circle></g><rect class="in spot" style="animation-delay:0.20s" x="288" y="230" width="200" height="110" rx="8" fill="#22343c" stroke="#e5605a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="288" y="230" width="200" height="4" rx="2" fill="#e5605a"/><text class="in" style="animation-delay:0.20s" x="306" y="272" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">kill switch?</text><text class="in" style="animation-delay:0.20s" x="306" y="298" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="10" fill="#8fa1ad" text-anchor="start" font-weight="400">100_build_complete.flag</text><line class="in flow" style="animation-delay:0.20s" x1="488" y1="285" x2="516" y2="285" stroke="#e5605a" stroke-width="2"/><polygon class="in" style="animation-delay:0.20s" transform="rotate(0.0 516 285)" points="516,285 507,280 507,290" fill="#e5605a"/><g class="in" style="animation-delay:0.20s"><circle r="4" fill="#e5605a"><animateMotion dur="0.90s" begin="0.20s" repeatCount="indefinite" path="M 488 285 L 516 285"/></circle></g><rect class="in spot" style="animation-delay:0.30s" x="516" y="230" width="200" height="110" rx="8" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.30s" x="516" y="230" width="200" height="4" rx="2" fill="#e8c34a"/><text class="in" style="animation-delay:0.30s" x="534" y="272" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">skip flagged</text><text class="in" style="animation-delay:0.30s" x="534" y="298" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="10" fill="#8fa1ad" text-anchor="start" font-weight="400">NN_step_installed.flag</text><line class="in flow" style="animation-delay:0.30s" x1="716" y1="285" x2="744" y2="285" stroke="#e8c34a" stroke-width="2"/><polygon class="in" style="animation-delay:0.30s" transform="rotate(0.0 744 285)" points="744,285 735,280 735,290" fill="#e8c34a"/><g class="in" style="animation-delay:0.30s"><circle r="4" fill="#e8c34a"><animateMotion dur="0.90s" begin="0.30s" repeatCount="indefinite" path="M 716 285 L 744 285"/></circle></g><rect class="in spot" style="animation-delay:0.40s" x="744" y="230" width="200" height="110" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.40s" x="744" y="230" width="200" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.40s" x="762" y="272" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">run next step</text><text class="in" style="animation-delay:0.40s" x="762" y="298" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="10" fill="#8fa1ad" text-anchor="start" font-weight="400">local Staging &#183; 0 / 3010</text><line class="in flow" style="animation-delay:0.40s" x1="944" y1="285" x2="972" y2="285" stroke="#49afd9" stroke-width="2"/><polygon class="in" style="animation-delay:0.40s" transform="rotate(0.0 972 285)" points="972,285 963,280 963,290" fill="#49afd9"/><g class="in" style="animation-delay:0.40s"><circle r="4" fill="#49afd9"><animateMotion dur="0.90s" begin="0.40s" repeatCount="indefinite" path="M 944 285 L 972 285"/></circle></g><rect class="in spot" style="animation-delay:0.50s" x="972" y="230" width="200" height="110" rx="8" fill="#22343c" stroke="#b58ad6" stroke-width="1.5"/><rect class="in" style="animation-delay:0.50s" x="972" y="230" width="200" height="4" rx="2" fill="#b58ad6"/><text class="in" style="animation-delay:0.50s" x="990" y="272" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">reboot?</text><text class="in" style="animation-delay:0.50s" x="990" y="298" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="10" fill="#8fa1ad" text-anchor="start" font-weight="400">Restart-Computer; exit</text><path class="in flow" style="animation-delay:0.60s" d="M 1072 340 L 1072 400 L 160 400 L 160 340" fill="none" stroke="#b58ad6" stroke-width="2"/><polygon class="in" style="animation-delay:0.60s" points="160,340 155,352 165,352" fill="#b58ad6"/><text class="in" style="animation-delay:0.60s" x="600" y="392" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#b58ad6" text-anchor="middle" font-weight="400">next boot</text><rect class="in spot" style="animation-delay:0.70s" x="160" y="450" width="880" height="110" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.70s" x="160" y="450" width="880" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.70s" x="180" y="485" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="12" fill="#e9eef2" text-anchor="start" font-weight="400">then: cleanup (eject ISO &#183; restore UAC &#183; remove cloudbase-init) &#8594; validate &#8594; publish &#8594; scrub &#8594; delete self &#8594; final reboot</text><text class="in" style="animation-delay:0.70s" x="180" y="520" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">data-state.json keeps true step timings across every reboot</text></svg>