<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="710" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="710"/><line x1="80" y1="0" x2="80" y2="710"/><line x1="160" y1="0" x2="160" y2="710"/><line x1="240" y1="0" x2="240" y2="710"/><line x1="320" y1="0" x2="320" y2="710"/><line x1="400" y1="0" x2="400" y2="710"/><line x1="480" y1="0" x2="480" y2="710"/><line x1="560" y1="0" x2="560" y2="710"/><line x1="640" y1="0" x2="640" y2="710"/><line x1="720" y1="0" x2="720" y2="710"/><line x1="800" y1="0" x2="800" y2="710"/><line x1="880" y1="0" x2="880" y2="710"/><line x1="960" y1="0" x2="960" y2="710"/><line x1="1040" y1="0" x2="1040" y2="710"/><line x1="1120" y1="0" x2="1120" y2="710"/><line x1="1200" y1="0" x2="1200" y2="710"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="640" x2="1200" y2="640"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#49afd9" text-anchor="middle" font-weight="600" letter-spacing="3">TWO LAYERS, EACH HELPING WITH BIG PACKETS</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="30" fill="#e9eef2" text-anchor="middle" font-weight="700">Where the frames died, twice</text><text class="in" style="animation-delay:0.00s" x="50" y="160" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#49afd9" text-anchor="start" font-weight="600" letter-spacing="2">INSIDE THE POD: NESTED ESXi</text><text class="in" style="animation-delay:0.00s" x="50" y="442" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="600" letter-spacing="2">THE OUTER LAYER: REAL ESXi</text><rect class="in spot" style="animation-delay:0.10s" x="50" y="175" width="320" height="150" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="50" y="175" width="320" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.10s" x="70" y="208" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="18" fill="#e9eef2" text-anchor="start" font-weight="600">sending nested host</text><text class="in" style="animation-delay:0.10s" x="70" y="236" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">NSX wraps TCP in Geneve</text><text class="in" style="animation-delay:0.10s" x="70" y="262" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#8fa1ad" text-anchor="start" font-weight="400">nvmxnet3_ens, Enhanced Datapath</text><text class="in" style="animation-delay:0.10s" x="70" y="296" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#e8c34a" text-anchor="start" font-weight="400">encapOffload Auto: TSO256k</text><rect class="in spot" style="animation-delay:0.20s" x="830" y="175" width="320" height="150" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="830" y="175" width="320" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.20s" x="850" y="208" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="18" fill="#e9eef2" text-anchor="start" font-weight="600">receiving nested host</text><text class="in" style="animation-delay:0.20s" x="850" y="236" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#8fa1ad" text-anchor="start" font-weight="400">nvmxnet3_ens uplink</text><text class="in" style="animation-delay:0.20s" x="850" y="262" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">gets one merged Geneve frame</text><text class="in blink" style="animation-delay:0.20s" x="850" y="296" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#e5605a" text-anchor="start" font-weight="400">[rq0] pkts rx err</text><rect class="in spot" style="animation-delay:0.30s" x="50" y="455" width="320" height="130" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.30s" x="70" y="488" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="18" fill="#e9eef2" text-anchor="start" font-weight="600">outer host, send side</text><text class="in" style="animation-delay:0.30s" x="70" y="516" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">vmxnet3 backend, vDS</text><text class="in" style="animation-delay:0.30s" x="70" y="542" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">trunk port group</text><text class="in" style="animation-delay:0.30s" x="70" y="568" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="start" font-weight="400">MAC learning, not promiscuous</text><rect class="in spot" style="animation-delay:0.40s" x="830" y="455" width="320" height="130" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.40s" x="850" y="488" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="18" fill="#e9eef2" text-anchor="start" font-weight="600">outer host, receive side</text><text class="in" style="animation-delay:0.40s" x="850" y="516" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e8c34a" text-anchor="start" font-weight="400">LRO merges TCP into VMs</text><text class="in" style="animation-delay:0.40s" x="850" y="542" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#8fa1ad" text-anchor="start" font-weight="400">Net.Vmxnet3HwLRO=1 SwLRO=1</text><text class="in" style="animation-delay:0.40s" x="850" y="568" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="start" font-weight="400">promiscuous ports exempt</text><line class="in" style="animation-delay:0.40s" x1="330" y1="325" x2="330" y2="455" stroke="#e5605a" stroke-width="3" stroke-dasharray="6 6"/><g class="in" style="animation-delay:0.40s"><circle r="3" fill="#e5605a"><animateMotion dur="0.93s" begin="0.40s" repeatCount="indefinite" path="M 330 325 L 330 455"/></circle></g><line class="in flow" style="animation-delay:0.40s" x1="370" y1="520" x2="830" y2="520" stroke="#49afd9" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.40s" transform="rotate(0.0 830 520)" points="830,520 821,515 821,525" fill="#49afd9"/><g class="in" style="animation-delay:0.40s"><circle r="4" fill="#49afd9"><animateMotion dur="2.40s" begin="0.40s" repeatCount="indefinite" path="M 370 520 L 830 520"/></circle></g><text class="in" style="animation-delay:0.40s" x="600" y="506" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">physical 10G NICs (bnxtnet)</text><line class="in" style="animation-delay:0.40s" x1="870" y1="455" x2="870" y2="325" stroke="#e5605a" stroke-width="3" stroke-dasharray="6 6"/><g class="in" style="animation-delay:0.40s"><circle r="3" fill="#e5605a"><animateMotion dur="0.93s" begin="0.40s" repeatCount="indefinite" path="M 870 455 L 870 325"/></circle></g><line class="in blink" style="animation-delay:0.40s" x1="859" y1="341" x2="881" y2="363" stroke="#e5605a" stroke-width="5"/><line class="in blink" style="animation-delay:0.40s" x1="881" y1="341" x2="859" y2="363" stroke="#e5605a" stroke-width="5"/><rect class="in spot" style="animation-delay:0.50s" x="410" y="175" width="380" height="125" rx="8" fill="#22343c" stroke="#e5605a" stroke-width="1.5"/><text class="in" style="animation-delay:0.50s" x="428" y="203" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e5605a" text-anchor="start" font-weight="600" letter-spacing="2">FAULT 1 &#183; SEND SIDE</text><text class="in" style="animation-delay:0.50s" x="428" y="230" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">a 64 KB+ super-frame goes down whole</text><text class="in" style="animation-delay:0.50s" x="428" y="254" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">only frames up to 1,600 bytes arrive</text><text class="in" style="animation-delay:0.50s" x="428" y="284" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#5fb84a" text-anchor="start" font-weight="600">fix: encapOffload=0</text><rect class="in spot" style="animation-delay:0.60s" x="410" y="315" width="380" height="125" rx="8" fill="#22343c" stroke="#e5605a" stroke-width="1.5"/><text class="in" style="animation-delay:0.60s" x="428" y="343" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e5605a" text-anchor="start" font-weight="600" letter-spacing="2">FAULT 2 &#183; RECEIVE SIDE</text><text class="in" style="animation-delay:0.60s" x="428" y="370" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">LRO merges Geneve TCP segments</text><text class="in" style="animation-delay:0.60s" x="428" y="394" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">267 port drops, 267 rx errors</text><text class="in" style="animation-delay:0.60s" x="428" y="424" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#5fb84a" text-anchor="start" font-weight="600">fix: disableLRO=1</text><line class="in" style="animation-delay:0.60s" x1="410" y1="290" x2="336" y2="385" stroke="#e5605a" stroke-width="1.5" stroke-dasharray="3 4"/><g class="in" style="animation-delay:0.60s"><circle r="3" fill="#e5605a"><animateMotion dur="0.90s" begin="0.60s" repeatCount="indefinite" path="M 410 290 L 336 385"/></circle></g><line class="in" style="animation-delay:0.60s" x1="790" y1="400" x2="864" y2="400" stroke="#e5605a" stroke-width="1.5" stroke-dasharray="3 4"/><g class="in" style="animation-delay:0.60s"><circle r="3" fill="#e5605a"><animateMotion dur="0.90s" begin="0.60s" repeatCount="indefinite" path="M 790 400 L 864 400"/></circle></g><rect class="in spot" style="animation-delay:0.70s" x="50" y="610" width="1100" height="56" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.70s" x="50" y="610" width="1100" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.70s" x="70" y="644" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#5fb84a" text-anchor="start" font-weight="400">esxcli system module parameters set -m nvmxnet3_ens -p "encapOffload=0 rxInnerOffload=0 disableLRO=1"</text><text class="in" style="animation-delay:0.70s" x="1132" y="644" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e8c34a" text-anchor="end" font-weight="600">both drivers + reboot</text><text class="in" style="animation-delay:0.70s" x="600" y="694" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">small packets are never offloaded or merged: that is why pings, BFD and handshakes looked perfect</text></svg>