<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="680" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="680"/><line x1="80" y1="0" x2="80" y2="680"/><line x1="160" y1="0" x2="160" y2="680"/><line x1="240" y1="0" x2="240" y2="680"/><line x1="320" y1="0" x2="320" y2="680"/><line x1="400" y1="0" x2="400" y2="680"/><line x1="480" y1="0" x2="480" y2="680"/><line x1="560" y1="0" x2="560" y2="680"/><line x1="640" y1="0" x2="640" y2="680"/><line x1="720" y1="0" x2="720" y2="680"/><line x1="800" y1="0" x2="800" y2="680"/><line x1="880" y1="0" x2="880" y2="680"/><line x1="960" y1="0" x2="960" y2="680"/><line x1="1040" y1="0" x2="1040" y2="680"/><line x1="1120" y1="0" x2="1120" y2="680"/><line x1="1200" y1="0" x2="1200" y2="680"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="640" x2="1200" y2="640"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#49afd9" text-anchor="middle" font-weight="600" letter-spacing="3">ONE SCRIPT, EVERY BOOT</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="30" fill="#e9eef2" text-anchor="middle" font-weight="700">A state machine made of boring parts</text><rect class="in spot" style="animation-delay:0.10s" x="50" y="160" width="320" height="440" rx="8" fill="#1b2a32" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="50" y="160" width="320" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.10s" x="68" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#49afd9" text-anchor="start" font-weight="600" letter-spacing="3">BOOT 3</text><text class="in" style="animation-delay:0.10s" x="352" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="end" font-weight="400">after reboot 2</text><rect class="in spot" style="animation-delay:0.20s" x="64" y="208" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.20s" x="78" y="233" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="600">100_build_complete.flag? no</text><rect class="in spot" style="animation-delay:0.30s" x="64" y="255" width="292" height="38" rx="6" fill="#22343c" stroke="#e9eef2" stroke-width="1.5"/><text class="in" style="animation-delay:0.30s" x="78" y="280" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="600">load data-state.json</text><rect class="in spot" style="animation-delay:0.40s" x="64" y="302" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.40s" x="78" y="327" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5fb84a" text-anchor="start" font-weight="400">MonitoringAgent: install, flag</text><rect class="in spot" style="animation-delay:0.50s" x="64" y="349" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.50s" x="78" y="374" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5fb84a" text-anchor="start" font-weight="400">InventoryAgent: install, flag</text><rect class="in spot" style="animation-delay:0.60s" x="64" y="396" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.60s" x="78" y="421" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5fb84a" text-anchor="start" font-weight="400">EndpointSecurity: install, flag</text><rect class="in spot" style="animation-delay:0.70s" x="64" y="443" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.70s" x="78" y="468" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5fb84a" text-anchor="start" font-weight="400">LogAgent: install, flag</text><rect class="in spot" style="animation-delay:0.80s" x="64" y="490" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.80s" x="78" y="515" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5fb84a" text-anchor="start" font-weight="400">WindowsUpdates: install, flag</text><rect class="in spot" style="animation-delay:0.90s" x="64" y="537" width="292" height="38" rx="6" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><text class="in" style="animation-delay:0.90s" x="78" y="562" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#e8c34a" text-anchor="start" font-weight="600">Reboot=$true: restart, exit</text><rect class="in spot" style="animation-delay:1.00s" x="440" y="160" width="320" height="440" rx="8" fill="#1b2a32" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:1.00s" x="440" y="160" width="320" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:1.00s" x="458" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#49afd9" text-anchor="start" font-weight="600" letter-spacing="3">BOOT 4</text><text class="in" style="animation-delay:1.00s" x="742" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="end" font-weight="400">after the update reboot</text><rect class="in spot" style="animation-delay:1.10s" x="454" y="208" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:1.10s" x="468" y="233" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="600">100_build_complete.flag? no</text><rect class="in spot" style="animation-delay:1.20s" x="454" y="255" width="292" height="38" rx="6" fill="#22343c" stroke="#e9eef2" stroke-width="1.5"/><text class="in" style="animation-delay:1.20s" x="468" y="280" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="600">load data-state.json</text><rect class="in spot" style="animation-delay:1.30s" x="454" y="302" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:1.30s" x="468" y="327" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">five steps: SKIP, timings kept</text><rect class="in spot" style="animation-delay:1.40s" x="454" y="349" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:1.40s" x="468" y="374" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">cleanup: ISO, UAC, cloudbase-init</text><rect class="in spot" style="animation-delay:1.50s" x="454" y="396" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:1.50s" x="468" y="421" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">validate: a strict verdict</text><rect class="in spot" style="animation-delay:1.60s" x="454" y="443" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:1.60s" x="468" y="468" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">report, then arm the flag</text><rect class="in spot" style="animation-delay:1.70s" x="454" y="490" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:1.70s" x="468" y="515" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">copy to the share, scrub secrets</text><rect class="in spot" style="animation-delay:1.80s" x="454" y="537" width="292" height="38" rx="6" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><text class="in" style="animation-delay:1.80s" x="468" y="562" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e8c34a" text-anchor="start" font-weight="600">self-destruct, final reboot</text><rect class="in spot" style="animation-delay:1.90s" x="830" y="160" width="320" height="440" rx="8" fill="#1b2a32" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:1.90s" x="830" y="160" width="320" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:1.90s" x="848" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5fb84a" text-anchor="start" font-weight="600" letter-spacing="3">BOOT 5</text><text class="in" style="animation-delay:1.90s" x="1132" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="end" font-weight="400">after the final reboot</text><rect class="in spot" style="animation-delay:2.00s" x="844" y="208" width="292" height="38" rx="6" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><text class="in" style="animation-delay:2.00s" x="858" y="233" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5fb84a" text-anchor="start" font-weight="600">a clean server</text><rect class="in spot" style="animation-delay:2.10s" x="844" y="255" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:2.10s" x="858" y="280" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">domain-joined</text><rect class="in spot" style="animation-delay:2.20s" x="844" y="302" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:2.20s" x="858" y="327" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">agents running</text><rect class="in spot" style="animation-delay:2.30s" x="844" y="349" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:2.30s" x="858" y="374" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">no credentials</text><rect class="in spot" style="animation-delay:2.40s" x="844" y="396" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:2.40s" x="858" y="421" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">no payloads</text><rect class="in spot" style="animation-delay:2.50s" x="844" y="443" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:2.50s" x="858" y="468" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">no tooling</text><rect class="in spot" style="animation-delay:2.60s" x="844" y="490" width="292" height="38" rx="6" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:2.60s" x="858" y="515" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">a stray run exits at once</text><line class="in flow" style="animation-delay:2.60s" x1="372" y1="400" x2="438" y2="400" stroke="#e8c34a" stroke-width="2.5"/><polygon class="in" style="animation-delay:2.60s" transform="rotate(0.0 438 400)" points="438,400 429,395 429,405" fill="#e8c34a"/><g class="in" style="animation-delay:2.60s"><circle r="4" fill="#e8c34a"><animateMotion dur="0.90s" begin="2.60s" repeatCount="indefinite" path="M 372 400 L 438 400"/></circle></g><text class="in" style="animation-delay:2.60s" x="405" y="386" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8c34a" text-anchor="middle" font-weight="600">reboot 3</text><line class="in flow" style="animation-delay:2.60s" x1="762" y1="400" x2="828" y2="400" stroke="#e8c34a" stroke-width="2.5"/><polygon class="in" style="animation-delay:2.60s" transform="rotate(0.0 828 400)" points="828,400 819,395 819,405" fill="#e8c34a"/><g class="in" style="animation-delay:2.60s"><circle r="4" fill="#e8c34a"><animateMotion dur="0.90s" begin="2.60s" repeatCount="indefinite" path="M 762 400 L 828 400"/></circle></g><text class="in" style="animation-delay:2.60s" x="795" y="386" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8c34a" text-anchor="middle" font-weight="600">reboot 4</text><text class="in" style="animation-delay:2.60s" x="600" y="640" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">every boot runs the same script; per-step flags make it converge, whatever the reboot count</text></svg>