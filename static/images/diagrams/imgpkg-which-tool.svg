<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="660" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="660"/><line x1="80" y1="0" x2="80" y2="660"/><line x1="160" y1="0" x2="160" y2="660"/><line x1="240" y1="0" x2="240" y2="660"/><line x1="320" y1="0" x2="320" y2="660"/><line x1="400" y1="0" x2="400" y2="660"/><line x1="480" y1="0" x2="480" y2="660"/><line x1="560" y1="0" x2="560" y2="660"/><line x1="640" y1="0" x2="640" y2="660"/><line x1="720" y1="0" x2="720" y2="660"/><line x1="800" y1="0" x2="800" y2="660"/><line x1="880" y1="0" x2="880" y2="660"/><line x1="960" y1="0" x2="960" y2="660"/><line x1="1040" y1="0" x2="1040" y2="660"/><line x1="1120" y1="0" x2="1120" y2="660"/><line x1="1200" y1="0" x2="1200" y2="660"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="640" x2="1200" y2="640"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#49afd9" text-anchor="middle" font-weight="600" letter-spacing="3">TWO TARBALLS THAT LOOK ALIKE</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="30" fill="#e9eef2" text-anchor="middle" font-weight="700">Which tool loads which archive into Harbor</text><rect class="in spot" style="animation-delay:0.10s" x="50" y="160" width="380" height="150" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="50" y="160" width="380" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.10s" x="70" y="194" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="20" fill="#e9eef2" text-anchor="start" font-weight="600">imgpkg tar</text><text class="in" style="animation-delay:0.10s" x="70" y="220" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">written by imgpkg copy --to-tar</text><text class="in" style="animation-delay:0.10s" x="70" y="256" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#49afd9" text-anchor="start" font-weight="400">manifest.json</text><text class="in" style="animation-delay:0.10s" x="70" y="284" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#49afd9" text-anchor="start" font-weight="400">sha256-*.tar.gz</text><rect class="in spot" style="animation-delay:0.20s" x="50" y="350" width="380" height="190" rx="8" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="50" y="350" width="380" height="4" rx="2" fill="#e8c34a"/><text class="in" style="animation-delay:0.20s" x="70" y="384" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="20" fill="#e9eef2" text-anchor="start" font-weight="600">OCI image layout</text><text class="in" style="animation-delay:0.20s" x="70" y="410" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">written by crane, skopeo or a</text><text class="in" style="animation-delay:0.20s" x="70" y="430" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">registry-API puller</text><text class="in" style="animation-delay:0.20s" x="70" y="466" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#e8c34a" text-anchor="start" font-weight="400">oci-layout</text><text class="in" style="animation-delay:0.20s" x="70" y="494" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#e8c34a" text-anchor="start" font-weight="400">index.json</text><text class="in" style="animation-delay:0.20s" x="70" y="522" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#e8c34a" text-anchor="start" font-weight="400">blobs/sha256/*</text><rect class="in spot" style="animation-delay:0.30s" x="520" y="195" width="300" height="80" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><text class="in" style="animation-delay:0.30s" x="540" y="230" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#5fb84a" text-anchor="start" font-weight="600">imgpkg copy --tar</text><text class="in" style="animation-delay:0.30s" x="540" y="258" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">reads only its own format</text><rect class="in spot" style="animation-delay:0.40s" x="520" y="360" width="300" height="70" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><text class="in" style="animation-delay:0.40s" x="540" y="392" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#5fb84a" text-anchor="start" font-weight="600">crane push</text><text class="in" style="animation-delay:0.40s" x="540" y="418" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">one static binary, reads OCI</text><rect class="in spot" style="animation-delay:0.50s" x="520" y="450" width="300" height="70" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.50s" x="540" y="482" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#49afd9" text-anchor="start" font-weight="600">skopeo copy</text><text class="in" style="animation-delay:0.50s" x="540" y="508" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">if it happens to be there</text><rect class="in spot" style="animation-delay:0.60s" x="900" y="160" width="250" height="380" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.60s" x="900" y="160" width="250" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.60s" x="920" y="194" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="20" fill="#e9eef2" text-anchor="start" font-weight="600">Harbor</text><text class="in" style="animation-delay:0.60s" x="920" y="220" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">at the dark site</text><text class="in" style="animation-delay:0.60s" x="920" y="266" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">imgpkg's copy keeps</text><text class="in" style="animation-delay:0.60s" x="920" y="292" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="400">the human tag</text><text class="in" style="animation-delay:0.60s" x="920" y="318" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="400">every digest</text><text class="in" style="animation-delay:0.60s" x="920" y="344" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="400">every platform</text><text class="in" style="animation-delay:0.60s" x="920" y="398" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e8c34a" text-anchor="start" font-weight="400">imgpkg's copy drops</text><text class="in" style="animation-delay:0.60s" x="920" y="424" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#e5605a" text-anchor="start" font-weight="400">cosign signatures</text><text class="in" style="animation-delay:0.60s" x="920" y="456" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">unless both ends say</text><text class="in" style="animation-delay:0.60s" x="920" y="482" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#e8c34a" text-anchor="start" font-weight="400">--cosign-signatures</text><line class="in flow" style="animation-delay:0.60s" x1="430" y1="235" x2="520" y2="235" stroke="#5fb84a" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.60s" transform="rotate(0.0 520 235)" points="520,235 511,230 511,240" fill="#5fb84a"/><g class="in" style="animation-delay:0.60s"><circle r="4" fill="#5fb84a"><animateMotion dur="0.90s" begin="0.60s" repeatCount="indefinite" path="M 430 235 L 520 235"/></circle></g><line class="in flow" style="animation-delay:0.60s" x1="820" 