m="rotate(3.2 520 485)" points="520,485 511,480 511,490" fill="#49afd9"/><g class="in" style="animation-delay:0.60s"><circle r="4" fill="#49afd9"><animateMotion dur="0.90s" begin="0.60s" repeatCount="indefinite" path="M 430 480 L 520 485"/></circle></g><line class="in flow" style="animation-delay:0.60s" x1="820" y1="485" x2="900" y2="485" stroke="#49afd9" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.60s" transform="rotate(0.0 900 485)" points="900,485 891,480 891,490" fill="#49afd9"/><g class="in" style="animation-delay:0.60s"><circle r="4" fill="#49afd9"><animateMotion dur="0.90s" begin="0.60s" repeatCount="indefinite" path="M 820 485 L 900 485"/></circle></g><rect class="in spot" style="animation-delay:0.70s" x="50" y="572" width="1100" height="50" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><text class="in" style="animation-delay:0.70s" x="70" y="603" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#49afd9" text-anchor="start" font-weight="600">tar -tf x.tar | head</text><text class="in" style="animation-delay:0.70s" x="285" y="603" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="400">before anything else: manifest.json means imgpkg, oci-layout means OCI. No converter exists.</text><text class="in" style="animation-delay:0.70s" x="600" y="648" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">stage imgpkg and crane with the tarballs: one of them will be the wrong tool for something</text></svg>