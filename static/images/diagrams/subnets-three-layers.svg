troke="#e8c34a" stroke-width="1.5" stroke-dasharray="7 5"/><text class="in" style="animation-delay:0.30s" x="785" y="341" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e8c34a" text-anchor="middle" font-weight="600">still held, for minutes</text><text class="in" style="animation-delay:0.30s" x="300" y="392" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">23:26:06</text><text class="in" style="animation-delay:0.30s" x="560" y="392" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">23:26:49</text><line class="in blink" style="animation-delay:0.30s" x1="632" y1="178" x2="632" y2="372" stroke="#e5605a" stroke-width="3"/><line class="in glow" style="animation-delay:0.30s" x1="1010" y1="178" x2="1010" y2="372" stroke="#5fb84a" stroke-width="3"/><text class="in" style="animation-delay:0.30s" x="640" y="428" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">the next lab, requested here: its subnets come out one block up,</text><text class="in" style="animation-delay:0.30s" x="640" y="450" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e5605a" text-anchor="start" font-weight="400">and NSX refuses dc01's .34 and the jump host's .35</text><rect class="in spot" style="animation-delay:0.40s" x="50" y="470" width="1100" height="40" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><text class="in" style="animation-delay:0.40s" x="70" y="496" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="600">lab_delete.py now waits here:</text><text class="in" style="animation-delay:0.40s" x="300" y="496" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#5fb84a" text-anchor="start" font-