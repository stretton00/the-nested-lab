<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="600" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="600"/><line x1="80" y1="0" x2="80" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/><line x1="560" y1="0" x2="560" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/><line x1="800" y1="0" x2="800" y2="600"/><line x1="880" y1="0" x2="880" y2="600"/><line x1="960" y1="0" x2="960" y2="600"/><line x1="1040" y1="0" x2="1040" y2="600"/><line x1="1120" y1="0" x2="1120" y2="600"/><line x1="1200" y1="0" x2="1200" y2="600"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#49afd9" text-anchor="middle" font-weight="600" letter-spacing="3">THE FAILOVER TEST, END TO END</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="30" fill="#e9eef2" text-anchor="middle" font-weight="700">One SSH session, two vNICs, one trunk subnet</text><rect class="in spot" style="animation-delay:0.10s" x="50" y="205" width="200" height="120" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="50" y="205" width="200" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.10s" x="70" y="240" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="19" fill="#e9eef2" text-anchor="start" font-weight="600">your SSH session</text><text class="in" style="animation-delay:0.10s" x="70" y="270" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#49afd9" text-anchor="start" font-weight="400">ssh root@esx01</text><text class="in" style="animation-delay:0.10s" x="70" y="300" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">through the public VIP</text><line class="in flow" style="animation-delay:0.10s" x1="250" y1="265" x2="300" y2="265" stroke="#49afd9" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.10s" transform="rotate(0.0 300 265)" points="300,265 291,260 291,270" fill="#49afd9"/><g class="in" style="animation-delay:0.10s"><circle r="4" fill="#49afd9"><animateMotion dur="0.90s" begin="0.10s" repeatCount="indefinite" path="M 250 265 L 300 265"/></circle></g><rect class="in spot" style="animation-delay:0.20s" x="300" y="205" width="200" height="120" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="300" y="205" width="200" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.20s" x="320" y="240" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="19" fill="#e9eef2" text-anchor="start" font-weight="600">NSX load balancer</text><text class="in" style="animation-delay:0.20s" x="320" y="270" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#49afd9" text-anchor="start" font-weight="400">public VIP</text><text class="in" style="animation-delay:0.20s" x="320" y="300" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">into the VPC</text><line class="in flow" style="animation-delay:0.20s" x1="500" y1="265" x2="550" y2="265" stroke="#49afd9" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.20s" transform="rotate(0.0 550 265)" points="550,265 541,260 541,270" fill="#49afd9"/><g class="in" style="animation-delay:0.20s"><circle r="4" fill="#49afd9"><animateMotion dur="0.90s" begin="0.20s" repeatCount="indefinite" path="M 500 265 L 550 265"/></circle></g><rect class="in spot" style="animation-delay:0.30s" x="550" y="165" width="250" height="200" rx="8" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.30s" x="550" y="165" width="250" height="4" rx="2" fill="#e8c34a"/><text class="in" style="animation-delay:0.30s" x="570" y="200" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="19" fill="#e9eef2" text-anchor="start" font-weight="600">VPC subnet sn-trunk</text><text class="in" style="animation-delay:0.30s" x="570" y="224" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">trunk, MAC learning on</text><rect class="in spot" style="animation-delay:0.40s" x="575" y="238" width="200" height="44" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.40s" x="590" y="266" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="400">port A</text><rect class="in glow" style="animation-delay:0.50s" x="575" y="296" width="200" height="44" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><text class="in" style="animation-delay:0.50s" x="590" y="324" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#5fb84a" text-anchor="start" font-weight="400">port B</text><rect class="in spot" style="animation-delay:0.60s" x="860" y="145" width="290" height="250" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.60s" x="860" y="145" width="290" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.60s" x="880" y="180" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="19" fill="#e9eef2" text-anchor="start" font-weight="600">esx01, nested ESXi</text><rect class="in spot" style="animation-delay:0.70s" x="880" y="196" width="120" height="44" rx="8" fill="#22343c" stroke="#e5605a" stroke-width="1.5"/><text class="in" style="animation-delay:0.70s" x="894" y="224" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#e5605a" text-anchor="start" font-weight="400">vmnic0</text><rect class="in glow" style="animation-delay:0.80s" x="880" y="254" width="120" height="44" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><text class="in" style="animation-delay:0.80s" x="894" y="282" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#5fb84a" text-anchor="start" font-weight="400">vmnic1</text><text class="in" style="animation-delay:0.80s" x="1016" y="224" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="start" font-weight="400">10 Gbit/s</text><text class="in" style="animation-delay:0.80s" x="1016" y="282" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="start" font-weight="400">10 Gbit/s</text><text class="in" style="animation-delay:0.80s" x="880" y="330" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="400">vSwitch0, active/active</text><text class="in" style="animation-delay:0.80s" x="880" y="354" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">vmk0 Mgmt 1610 &#183; vmk1 vMotion 1611</text><text class="in" style="animation-delay:0.80s" x="880" y="376" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">vmk2 vSAN 1612</text><line class="in" style="animation-delay:0.80s" x1="775" y1="260" x2="880" y2="218" stroke="#e5605a" stroke-width="3" stroke-dasharray="6 6"/><g class="in" style="animation-delay:0.80s"><circle r="3" fill="#e5605a"><animateMotion dur="0.90s" begin="0.80s" repeatCount="indefinite" path="M 775 260 L 880 218"/></circle></g><line class="in blink" style="animation-delay:0.80s" x1="814" y1="225" x2="842" y2="253" stroke="#e5605a" stroke-width="5"/><line class="in blink" style="animation-delay:0.80s" x1="842" y1="225" x2="814" y2="253" stroke="#e5605a" stroke-width="5"/><line class="in flow" style="animation-delay:0.80s" x1="775" y1="318" x2="880" y2="276" stroke="#5fb84a" stroke-width="3"/><g class="in" style="animation-delay:0.80s"><circle r="3" fill="#5fb84a"><animateMotion dur="0.90s" begin="0.80s" repeatCount="indefinite" path="M 775 318 L 880 276"/></circle></g><rect class="in spot" style="animation-delay:0.90s" x="50" y="425" width="1100" height="125" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.90s" x="50" y="425" width="1100" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.90s" x="70" y="461" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" fill="#49afd9" text-anchor="start" font-weight="600">esxcli network nic down -n vmnic0</text><text class="in pulse" style="animation-delay:0.90s" x="70" y="494" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" fill="#5fb84a" text-anchor="start" font-weight="400">every VLAN moves to vmnic1 &#183; 0% packet loss &#183; the SSH session never dropped</text><text class="in" style="animation-delay:0.90s" x="70" y="528" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e8c34a" text-anchor="start" font-weight="400">vmk0's MAC hops from port A to port B mid-flow: the trunk subnet allows it, a standard VPC port would drop it</text><text class="in" style="animation-delay:0.90s" x="600" y="584" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">the real redundancy lives one layer down, in the outer host</text></svg>