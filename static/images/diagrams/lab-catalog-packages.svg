s</text><line class="in" style="animation-delay:0.20s" x1="433" y1="265" x2="382" y2="265" stroke="#8fa1ad" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.20s" transform="rotate(180.0 382 265)" points="382,265 373,260 373,270" fill="#8fa1ad"/><rect class="in spot" style="animation-delay:0.30s" x="820" y="150" width="330" height="230" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.30s" x="820" y="150" width="330" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.30s" x="838" y="186" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" fill="#e9eef2" text-anchor="start" font-weight="600">nested-lab-catalog 2.2.0</text><text class="in" style="animation-delay:0.30s" x="838" y="224" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#8fa1ad" text-anchor="start" font-weight="400">five library images</text><text class="in" style="animation-delay:0.30s" x="838" y="256" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#8fa1ad" text-anchor="start" font-weight="400">two property groups</text><text class="in" style="animation-delay:0.30s" x="838" y="288" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#8fa1ad" text-anchor="start" font-weight="400">one secret, 8 blueprints</text><text class="in" style="animation-delay:0.30s" x="838" y="320" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#8fa1ad" text-anchor="start" font-weight="400">8 catalog items, 6 forms</text><text class="in" style="animation-delay:0.30s" x="838" y="352" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#8fa1ad" text-anchor="start" font-weight="400">acceptance tests</text><text class="in" style="animation-delay:0.30s" x="792" y="140" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="middle" font-weight="400">requires</text><line class="in" style="animation-delay:0.30s" x1="818" y1="265" x2="767" y2="265" stroke="#8fa1ad" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.30s" transform="rotate(180.0 767 265)" points="767,265 758,260 758,270" fill="#8fa1ad"/><line class="in flow" style="animation-delay:0.30s" x1="70" y1="425" x2="1130" y2="425" stroke="#49afd9" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.30s" transform="rotate(0.0 1130 425)" points="1130,425 1121,420 1121,430" fill="#49afd9"/><g class="in" style="animation-delay:0.30s"><circle r="4" fill="#49afd9"><animateMotion dur="2.40s" begin="0.30s" repeatCount="indefinite" path="M 70 425 L 1130 425"/></circle></g><text class="in" style="animation-delay:0.30s" x="70" y="455" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#49afd9" text-anchor="start" font-weight="400">install: each package after the ones it requires; each component looks before it makes</text><line class="in flow" style="animation-delay:0.30s" x1="1130" y1="485" x2="70" y2="485" stroke="#e8c34a" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.30s" transform="rotate(180.0 70 485)" points="70,485 61,480 61,490" fill="#e8c34a"/><g class="in" style="animation-delay:0.30s"><circle r="4" fill="#e8c34a"><animateMotion dur="2.40s" begin="0.30s" repeatCount="indefinite" path="M 1130 485 L 70 485"/></circle></g><text class="in" style="animation-delay:0.30s" x="70" y="515" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e8c34a" text-anchor="start" font-weight="400">uninstall: the same walk backwards; made: true goes, made: false stays</text><rect class="in spot" style="animation-delay:0.40s" x="50" y="535" width="1100" height="46" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.40s" x="50" y="535" width="1100" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.40s" x="70" y="565" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#5fb84a" text-anchor="start" font-weight="400">packages-state-&lt;site&gt;.json: every component, how it ran, and each id it made or found</text><text class="in" style="animation-delay:0.40s" x="600" y="608" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">a killed run is safe too: the record is written before an upload, a copy or a deployment</text></svg>