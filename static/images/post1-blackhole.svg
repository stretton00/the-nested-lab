<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1100" height="420" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="420"/><line x1="80" y1="0" x2="80" y2="420"/><line x1="160" y1="0" x2="160" y2="420"/><line x1="240" y1="0" x2="240" y2="420"/><line x1="320" y1="0" x2="320" y2="420"/><line x1="400" y1="0" x2="400" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/><line x1="560" y1="0" x2="560" y2="420"/><line x1="640" y1="0" x2="640" y2="420"/><line x1="720" y1="0" x2="720" y2="420"/><line x1="800" y1="0" x2="800" y2="420"/><line x1="880" y1="0" x2="880" y2="420"/><line x1="960" y1="0" x2="960" y2="420"/><line x1="1040" y1="0" x2="1040" y2="420"/><line x1="0" y1="0" x2="1100" y2="0"/><line x1="0" y1="80" x2="1100" y2="80"/><line x1="0" y1="160" x2="1100" y2="160"/><line x1="0" y1="240" x2="1100" y2="240"/><line x1="0" y1="320" x2="1100" y2="320"/><line x1="0" y1="400" x2="1100" y2="400"/></g><text class="in" style="animation-delay:0.00s" x="60" y="70" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e5605a" text-anchor="start" font-weight="600" letter-spacing="3">FAILURE #1 &#183; THE SILENT BLACKHOLE</text><text class="in" style="animation-delay:0.00s" x="60" y="120" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="24" fill="#e9eef2" text-anchor="start" font-weight="700">Standard VPC subnet + nested ESXi = every frame dropped</text><rect class="in spot" style="animation-delay:0.10s" x="60" y="170" width="330" height="180" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="60" y="170" width="330" height="4" rx="2" fill="#e5605a"/><text class="in" style="animation-delay:0.10s" x="80" y="205" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="400">vmk0 sends with its OWN MAC</text><text class="in" style="animation-delay:0.10s" x="80" y="240" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="20" fill="#e5605a" text-anchor="start" font-weight="600">00:50:ac:1e:00:8c</text><text class="in" style="animation-delay:0.10s" x="80" y="275" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">vNIC MAC (what NSX pinned):</text><text class="in" style="animation-delay:0.10s" x="80" y="300" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#8fa1ad" text-anchor="start" font-weight="400">04:50:56:00:60:01</text><line class="in flow" style="animation-delay:0.10s" x1="390" y1="260" x2="560" y2="260" stroke="#e5605a" stroke-width="3"/><g class="in" style="animation-delay:0.10s"><circle r="3" fill="#e5605a"><animateMotion dur="1.21s" begin="0.10s" repeatCount="indefinite" path="M 390 260 L 560 260"/></circle></g><line class="in blink" style="animation-delay:0.10s" x1="552" y1="242" x2="588" y2="278" stroke="#e5605a" stroke-width="5"/><line class="in blink" style="animation-delay:0.10s" x1="588" y1="242" x2="552" y2="278" stroke="#e5605a" stroke-width="5"/><rect class="in spot" style="animation-delay:0.20s" x="650" y="170" width="390" height="180" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.20s" x="670" y="205" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">VPC subnet port</text><text class="in" style="animation-delay:0.20s" x="670" y="240" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">address_bindings: 1 IP + 1 MAC</text><text class="in" style="animation-delay:0.20s" x="670" y="272" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">SpoofGuard drops everything else &#8212;</text><text class="in" style="animation-delay:0.20s" x="670" y="298" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e5605a" text-anchor="start" font-weight="400">ARP included. No error. Anywhere.</text><text class="in" style="animation-delay:0.20s" x="60" y="392" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="start" font-weight="400">The host boots green and reports healthy. You just can&#8217;t reach it, ever.</text></svg>