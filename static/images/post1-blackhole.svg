<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420"><rect width="1100" height="420" fill="#0b1118"/><g stroke="#22303d" stroke-width="1" opacity="0.35"><line x1="0" y1="0" x2="0" y2="420"/><line x1="80" y1="0" x2="80" y2="420"/><line x1="160" y1="0" x2="160" y2="420"/><line x1="240" y1="0" x2="240" y2="420"/><line x1="320" y1="0" x2="320" y2="420"/><line x1="400" y1="0" x2="400" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/><line x1="560" y1="0" x2="560" y2="420"/><line x1="640" y1="0" x2="640" y2="420"/><line x1="720" y1="0" x2="720" y2="420"/><line x1="800" y1="0" x2="800" y2="420"/><line x1="880" y1="0" x2="880" y2="420"/><line x1="960" y1="0" x2="960" y2="420"/><line x1="1040" y1="0" x2="1040" y2="420"/><line x1="0" y1="0" x2="1100" y2="0"/><line x1="0" y1="80" x2="1100" y2="80"/><line x1="0" y1="160" x2="1100" y2="160"/><line x1="0" y1="240" x2="1100" y2="240"/><line x1="0" y1="320" x2="1100" y2="320"/><line x1="0" y1="400" x2="1100" y2="400"/></g><text x="60" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d3705f" text-anchor="start" font-weight="600" letter-spacing="3">FAILURE #1 &#183; THE SILENT BLACKHOLE</text><text x="60" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="24" fill="#e8eef4" text-anchor="start" font-weight="700">Standard VPC subnet + nested ESXi = every frame dropped</text><rect x="60" y="170" width="330" height="180" rx="10" fill="#121b25" stroke="#22303d"/><rect x="60" y="170" width="330" height="4" rx="2" fill="#d3705f"/><text x="80" y="205" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#e8eef4" text-anchor="start" font-weight="400">vmk0 sends with its OWN MAC</text><text x="80" y="240" font-family="Cascadia Mono, Consolas, monospace" font-size="20" fill="#d3705f" text-anchor="start" font-weight="600">00:50:ac:1e:00:8c</text><text x="80" y="275" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7e93a6" text-anchor="start" font-weight="400">vNIC MAC (what NSX pinned):</text><text x="80" y="300" font-family="Cascadia Mono, Consolas, monospace" font-size="16" fill="#7e93a6" text-anchor="start" font-weight="400">04:50:56:00:60:01</text><line x1="390" y1="260" x2="560" y2="260" stroke="#d3705f" stroke-width="3" stroke-dasharray="8 6"/><line x1="545" y1="235" x2="595" y2="285" stroke="#d3705f" stroke-width="5"/><line x1="595" y1="235" x2="545" y2="285" stroke="#d3705f" stroke-width="5"/><rect x="650" y="170" width="390" height="180" rx="10" fill="#121b25" stroke="#22303d"/><text x="670" y="205" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#e8eef4" text-anchor="start" font-weight="600">VPC subnet port</text><text x="670" y="240" font-family="Cascadia Mono, Consolas, monospace" font-size="15" fill="#7e93a6" text-anchor="start" font-weight="400">address_bindings: 1 IP + 1 MAC</text><text x="670" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#7e93a6" text-anchor="start" font-weight="400">SpoofGuard drops everything else &#8212;</text><text x="670" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#d3705f" text-anchor="start" font-weight="400">ARP included. No error. Anywhere.</text><text x="60" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#7e93a6" text-anchor="start" font-weight="400">The host boots green and reports healthy. You just can&#8217;t reach it, ever.</text></svg>