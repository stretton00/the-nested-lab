<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="630" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#49afd9" text-anchor="middle" font-weight="600" letter-spacing="3">SAME CLUSTER OBJECT &#183; DIFFERENT SERVICE</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="40" fill="#e9eef2" text-anchor="middle" font-weight="700">One VKS cluster, two ways</text><rect class="in spot" style="animation-delay:0.10s" x="450" y="200" width="300" height="110" rx="8" fill="#22343c" stroke="#e9eef2" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="450" y="200" width="300" height="4" rx="2" fill="#e9eef2"/><text class="in" style="animation-delay:0.10s" x="600" y="240" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" fill="#e9eef2" text-anchor="middle" font-weight="700">kind: Cluster</text><text class="in" style="animation-delay:0.10s" x="600" y="265" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="12" fill="#8fa1ad" text-anchor="middle" font-weight="400">builtin-generic-v3.6.0 &#183; v1.35.5</text><text class="in pulse" style="animation-delay:0.10s" x="600" y="290" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#5fb84a" text-anchor="middle" font-weight="400">byte-identical</text><rect class="in spot" style="animation-delay:0.20s" x="80" y="380" width="420" height="170" rx="8" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="80" y="380" width="420" height="4" rx="2" fill="#e8c34a"/><text class="in" style="animation-delay:0.20s" x="100" y="415" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="18" fill="#e8c34a" text-anchor="start" font-weight="700">kubectl apply</text><text class="in" style="animation-delay:0.20s" x="100" y="445" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">&#8226; admin-made namespace, by hand</text><text class="in" style="animation-delay:0.20s" x="100" y="471" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">&#8226; quota set in vSphere Client</text><text class="in" style="animation-delay:0.20s" x="100" y="497" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">&#8226; library attached manually</text><text class="in" style="animation-delay:0.20s" x="100" y="523" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">&#8226; a thing that exists</text><rect class="in spot" style="animation-delay:0.30s" x="700" y="380" width="420" height="170" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.30s" x="700" y="380" width="420" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.30s" x="720" y="415" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="18" fill="#49afd9" text-anchor="start" font-weight="700">All Apps request</text><text class="in" style="animation-delay:0.30s" x="720" y="445" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e9eef2" text-anchor="start" font-weight="400">&#8226; namespace from a class (quota)</text><text class="in" style="animation-delay:0.30s" x="720" y="471" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e9eef2" text-anchor="start" font-weight="400">&#8226; contentSources &#183; vpcName</text><text class="in" style="animation-delay:0.30s" x="720" y="497" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e9eef2" text-anchor="start" font-weight="400">&#8226; org RBAC &#183; deployment history</text><text class="in" style="animation-delay:0.30s" x="720" y="523" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e9eef2" text-anchor="start" font-weight="400">&#8226; visible in VCF Operations</text><line class="in flow" style="animation-delay:0.30s" x1="500" y1="310" x2="290" y2="380" stroke="#e8c34a" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.30s" points="290,380 281,375 281,385" fill="#e8c34a"/><g class="in" style="animation-delay:0.30s"><circle r="4" fill="#e8c34a"><animateMotion dur="1.58s" begin="0.30s" repeatCount="indefinite" path="M 500 310 L 290 380"/></circle></g><line class="in flow" style="animation-delay:0.30s" x1="700" y1="310" x2="910" y2="380" stroke="#49afd9" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.30s" points="910,380 901,375 901,385" fill="#49afd9"/><g class="in" style="animation-delay:0.30s"><circle r="4" fill="#49afd9"><animateMotion dur="1.58s" begin="0.30s" repeatCount="indefinite" path="M 700 310 L 910 380"/></circle></g></svg>