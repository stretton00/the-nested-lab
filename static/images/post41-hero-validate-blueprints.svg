<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="630" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#49afd9" text-anchor="middle" font-weight="600" letter-spacing="3">THE LAB FACTORY &#183; CHECKS BEFORE A REQUEST</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="36" fill="#e9eef2" text-anchor="middle" font-weight="700">Validate a blueprint without saving it</text><rect class="in spot" style="animation-delay:0.10s" x="70" y="180" width="300" height="170" rx="8" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="70" y="180" width="300" height="4" rx="2" fill="#e8c34a"/><text class="in" style="animation-delay:0.10s" x="90" y="216" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="600">blueprint-validation</text><text class="in" style="animation-delay:0.10s" x="90" y="248" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">types, inputs, property</text><text class="in" style="animation-delay:0.10s" x="90" y="268" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">groups, anywhere in it</text><text class="in" style="animation-delay:0.10s" x="90" y="306" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e8c34a" text-anchor="start" font-weight="400">nothing is saved</text><line class="in flow" style="animation-delay:0.10s" x1="370" y1="265" x2="450" y2="265" stroke="#e8c34a" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.10s" transform="rotate(0.0 450 265)" points="450,265 441,260 441,270" fill="#e8c34a"/><g class="in" style="animation-delay:0.10s"><circle r="4" fill="#e8c34a"><animateMotion dur="0.90s" begin="0.10s" repeatCount="indefinite" path="M 370 265 L 450 265"/></circle></g><rect class="in spot" style="animation-delay:0.20s" x="450" y="180" width="300" height="170" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="450" y="180" width="300" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.20s" x="470" y="216" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">Supervisor dry run</text><text class="in" style="animation-delay:0.20s" x="470" y="248" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">each manifest against</text><text class="in" style="animation-delay:0.20s" x="470" y="268" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">its schema and webhooks</text><text class="in" style="animation-delay:0.20s" x="470" y="306" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9" text-anchor="start" font-weight="400">--validate=strict</text><line class="in flow" style="animation-delay:0.20s" x1="750" y1="265" x2="830" y2="265" stroke="#49afd9" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.20s" transform="rotate(0.0 830 265)" points="830,265 821,260 821,270" fill="#49afd9"/><g class="in" style="animation-delay:0.20s"><circle r="4" fill="#49afd9"><animateMotion dur="0.90s" begin="0.20s" repeatCount="indefinite" path="M 750 265 L 830 265"/></circle></g><rect class="in spot" style="animation-delay:0.30s" x="830" y="180" width="300" height="170" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.30s" x="830" y="180" width="300" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.30s" x="850" y="216" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">released = generated?</text><text class="in" style="animation-delay:0.30s" x="850" y="248" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">each released version</text><text class="in" style="animation-delay:0.30s" x="850" y="268" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">diffed with the generator</text><text class="in pulse" style="animation-delay:0.30s" x="850" y="306" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5fb84a" text-anchor="start" font-weight="400">0 line(s) differ</text><rect class="in spot" style="animation-delay:0.40s" x="70" y="400" width="1060" height="140" rx="8" fill="#22343c" stroke="#e5605a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.40s" x="70" y="400" width="1060" height="4" rx="2" fill="#e5605a"/><text class="in" style="animation-delay:0.40s" x="90" y="436" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="600">what each check catches that the others miss</text><text class="in" style="animation-delay:0.40s" x="90" y="470" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#e8c34a" text-anchor="start" font-weight="400">Resource type CCI.Supervisor.Namespaze not found</text><text class="in blink" style="animation-delay:0.40s" x="90" y="502" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#e5605a" text-anchor="start" font-weight="700">strict decoding error: unknown field &quot;spec.classNmae&quot;</text><text class="in" style="animation-delay:0.40s" x="600" y="590" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">three API calls before anyone presses Request</text></svg>