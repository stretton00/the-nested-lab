tself as a plain vRO run &#8212; no catalog token, no 2-hour kill</text><text class="in" style="animation-delay:0.50s" x="320" y="468" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="12" fill="#8fa1ad" text-anchor="start" font-weight="400">polls bringupWatchTaskId ~8 h &#8594; certs &#8594; fleet &#8594; edge &#8594; supervisor &#8594; identity</text><text class="in" style="animation-delay:0.50s" x="320" y="495" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="12" fill="#5fb84a" text-anchor="start" font-weight="400">COMPLETED_WITH_SUCCESS 305/305</text><text class="in" style="animation-delay:0.50s" x="600" y="580" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">the request&#8217;s job is to start the work correctly and tell you where to watch it</text></svg>