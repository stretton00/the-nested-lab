<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="630" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e5605a" text-anchor="middle" font-weight="600" letter-spacing="3">OBSERVABILITY ON VCF &#183; AD SIGN-IN</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="40" fill="#e9eef2" text-anchor="middle" font-weight="700">The group that forgot its members</text><rect class="in spot" style="animation-delay:0.10s" x="70" y="180" width="500" height="170" rx="8" fill="#22343c" stroke="#e5605a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="70" y="180" width="500" height="4" rx="2" fill="#e5605a"/><text class="in" style="animation-delay:0.10s" x="90" y="216" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">name = the short name</text><text class="in" style="animation-delay:0.10s" x="90" y="248" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">POST /auth/usergroups</text><text class="in" style="animation-delay:0.10s" x="90" y="274" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e5605a" text-anchor="start" font-weight="400">name: gg_vcf_ops_readonly</text><text class="in" style="animation-delay:0.10s" x="90" y="300" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fa1ad" text-anchor="start" font-weight="400">a new group the source doesn&#8217;t know</text><text class="in blink" style="animation-delay:0.10s" x="90" y="330" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e5605a" text-anchor="start" font-weight="400">group sync: 0 members, ~105 s later</text><line class="in flow" style="animation-delay:0.10s" x1="570" y1="265" x2="630" y2="265" stroke="#49afd9" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.10s" transform="rotate(0.0 630 265)" points="630,265 621,260 621,270" fill="#49afd9"/><g class="in" style="animation-delay:0.10s"><circle r="4" fill="#49afd9"><animateMotion dur="0.90s" begin="0.10s" repeatCount="indefinite" path="M 570 265 L 630 265"/></circle></g><rect class="in spot" style="animation-delay:0.20s" x="630" y="180" width="500" height="170" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="630" y="180" width="500" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.20s" x="650" y="216" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">name = the distinguished name</text><text class="in" style="animation-delay:0.20s" x="650" y="248" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5fb84a" text-anchor="start" font-weight="400">CN=gg_vcf_ops_readonly,</text><text class="in" style="animation-delay:0.20s" x="650" y="272" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5fb84a" text-anchor="start" font-weight="400">OU=Lab Groups,DC=acme,DC=training</text><text class="in" style="animation-delay:0.20s" x="650" y="300" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fa1ad" text-anchor="start" font-weight="400">displayName: the short name</text><text class="in pulse" style="animation-delay:0.20s" x="650" y="330" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5fb84a" text-anchor="start" font-weight="400">group sync keeps and follows AD</text><rect class="in spot" style="animation-delay:0.30s" x="70" y="400" width="1060" height="140" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.30s" x="70" y="400" width="1060" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.30s" x="90" y="436" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="600">the build proves it with a real sign-in, one per group</text><text class="in" style="animation-delay:0.30s" x="90" y="470" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#49afd9" text-anchor="start" font-weight="400">AD sign-in: group sync started</text><text class="in" style="animation-delay:0.30s" x="90" y="500" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5fb84a" text-anchor="start" font-weight="400">AD sign-in: checked - alice@acme.training signs in (gg_vcf_ops_administrators)</text><text class="in" style="animation-delay:0.30s" x="600" y="590" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">for an LDAP group the DN goes in name; the short name is only a label</text></svg>