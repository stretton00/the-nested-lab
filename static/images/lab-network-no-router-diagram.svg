<line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/>
</g>
<text x="40" y="52" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#49afd9">ONE NESTED LAB &#183; TWO WAYS TO NETWORK IT</text>
<text x="40" y="90" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700" fill="#e9eef2">The VPC gateway routes the lab&#8217;s VLANs. No VM sits in the path.</text>

