<text x="972" y="316" font-size="13" fill="#8fa1ad">routes between the VLANs</text>
<text x="972" y="335" font-size="13" fill="#8fa1ad">masquerades out, forwards in</text>
<text x="972" y="355" font-size="13" fill="#e8c34a">an image to build and keep</text>

<rect x="726" y="270" width="196" height="96" rx="8" fill="#1b2a32" stroke="#8fa1ad" stroke-width="1.5" stroke-dasharray="6 5"/>
