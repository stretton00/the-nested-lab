<text x="58" y="144" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2" fill="#49afd9">THIS CATALOG &#183; vpc-student01 &#183; 172.30.0.0/16</text>

