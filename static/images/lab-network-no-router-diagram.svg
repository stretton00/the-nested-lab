<text x="740" y="449" font-size="13" fill="#8fa1ad">the router&#8217;s downlink and the hosts&#8217; vNICs</text>

<g stroke="#34495a" stroke-width="2"><line x1="772" y1="458" x2="772" y2="480"/><line x1="878" y1="458" x2="878" y2="480"/><line x1="984" y1="458" x2="984" y2="480"/><line x1="1090" y1="458" x2="1090" y2="480"/></g>
<rect x="726" y="480" width="92" height="50" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/>
