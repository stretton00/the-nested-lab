<text x="972" y="223" font-size="13" fill="#8fa1ad">connected to the gateway</text>

<line class="flow" x1="1055" y1="232" x2="1055" y2="266" stroke="#e8c34a" stroke-width="2.5" marker-end="url(#ay)"/>
