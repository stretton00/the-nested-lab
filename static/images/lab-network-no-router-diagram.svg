<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">One lab VPC beside a router-VM lab</title>
<desc id="d">Left, this catalog: in the lab's VPC the VPC gateway routes sn-mgmt, sn-vmotion and sn-vsan, which are bound to the hosts' trunk subnet by VLAN tags 1610, 1611 and 1612; the jump host and dc01 sit on sn-mgmt; the VPC load balancer publishes RDP to the jump host, and the transit gateway leads to the shared binaries server. Right, the router-VM design: the VLAN subnets are bound to the trunk but not connected to the VPC gateway, and a router VM with its uplink on a private subnet routes between them, masquerades traffic out and forwards SSH and RDP that a DNAT rule on the gateway sends to it.</desc>
<style>@keyframes nl-flow{to{stroke-dashoffset:-34}}.flow{stroke-dasharray:10 7;animation:nl-flow 1.4s linear infinite}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#49afd9"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fb84a"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b58ad6"/></marker>
