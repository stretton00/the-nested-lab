<g font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif">
<rect x="726" y="162" width="196" height="70" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="726" y="162" width="196" height="4" rx="2" fill="#0079b8"/>
