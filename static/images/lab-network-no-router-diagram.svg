<rect x="938" y="480" width="92" height="50" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/>
<rect x="1044" y="480" width="92" height="50" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/>
<g font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e9eef2"><text x="740" y="502">host</text><text x="846" y="502">host</text><text x="952" y="502">host</text><text x="1058" y="502">host</text></g>
<g font-size="12.5" fill="#8fa1ad"><text x="740" y="520">nested</text><text x="846" y="520">nested</text><text x="952" y="520">nested</text><text x="1058" y="520">nested</text></g>
<text x="726" y="552" font-size="13" fill="#e8c34a">every packet between networks, in or out, crosses the router</text>
</g>

<text x="600" y="598" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="middle">Left: NSX routes, NATs, load-balances and reaches shared services; the lab has no router of its own.</text>
<text x="600" y="622" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="middle">Right: the router is the lab&#8217;s to shape, and it sits in every path. Left-hand addresses are the f06 lab plan.</text>
