<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="630" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#49afd9" text-anchor="middle" font-weight="600" letter-spacing="3">ORG BUILDER FOR VCF AUTOMATION &#183; INTRODUCING</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="34" fill="#e9eef2" text-anchor="middle" font-weight="700">Build an organization once, release it anywhere</text><rect class="in spot" style="animation-delay:0.10s" x="70" y="170" width="330" height="250" rx="8" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="70" y="170" width="330" height="4" rx="2" fill="#e8c34a"/><text class="in" style="animation-delay:0.10s" x="90" y="206" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">by hand</text><text class="in" style="animation-delay:0.10s" x="90" y="238" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e8c34a" text-anchor="start" font-weight="400">several portals, in order</text><text class="in" style="animation-delay:0.10s" x="90" y="268" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">projects, VPCs, content libraries,</text><text class="in" style="animation-delay:0.10s" x="90" y="292" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">property groups, blueprints, forms,</text><text class="in" style="animation-delay:0.10s" x="90" y="316" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">catalog items, policies, secrets</text><text class="in" style="animation-delay:0.10s" x="90" y="356" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#e5605a" text-anchor="start" font-weight="700">again, for every organization</text><text class="in" style="animation-delay:0.10s" x="90" y="388" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fa1ad" text-anchor="start" font-weight="400">every value typed is a chance to be wrong</text><line class="in flow" style="animation-delay:0.10s" x1="400" y1="295" x2="480" y2="295" stroke="#e8c34a" stroke-width="2.5"/><polygon class="in" style="animation-delay:0.10s" transform="rotate(0.0 480 295)" points="480,295 471,290 471,300" fill="#e8c34a"/><g class="in" style="animation-delay:0.10s"><circle r="4" fill="#e8c34a"><animateMotion dur="0.90s" begin="0.10s" repeatCount="indefinite" path="M 400 295 L 480 295"/></circle></g><rect class="in spot" style="animation-delay:0.20s" x="480" y="170" width="650" height="250" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="480" y="170" width="650" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.20s" x="500" y="206" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">Org Builder</text><text class="in" style="animation-delay:0.20s" x="500" y="238" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9" text-anchor="start" font-weight="400">reads first &#183; previews &#183; builds through the APIs</text><text class="in" style="animation-delay:0.20s" x="500" y="268" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">a package says what, with a version number;</text><text class="in" style="animation-delay:0.20s" x="500" y="292" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">a site file says where, one per organization;</text><text class="in" style="animation-delay:0.20s" x="500" y="316" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">every object recorded as made or found</text><text class="in" style="animation-delay:0.20s" x="500" y="356" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#5fb84a" text-anchor="start" font-weight="700">install &#183; move &#183; update &#183; uninstall</text><text class="in pulse" style="animation-delay:0.20s" x="500" y="388" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fa1ad" text-anchor="start" font-weight="400">an update is the next version of the package</text><rect class="in spot" style="animation-delay:0.30s" x="70" y="460" width="1060" height="90" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><text class="in" style="animation-delay:0.30s" x="90" y="496" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#e9eef2" text-anchor="start" font-weight="600">Release an organization the way you release software: version 1.0, then 1.1</text><text class="in" style="animation-delay:0.30s" x="90" y="526" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9" text-anchor="start" font-weight="400">the same package and a different site file: the same service, somewhere else</text><text class="in" style="animation-delay:0.30s" x="600" y="590" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">our lab tooling, not a Broadcom product; VCF and VCF Automation are trademarks of Broadcom</text></svg>