<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="630" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#49afd9" text-anchor="middle" font-weight="600" letter-spacing="3">NESTED LABS AS CODE &#183; USE CASES</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="40" fill="#e9eef2" text-anchor="middle" font-weight="700">What a lab catalog is for</text><rect class="in spot" style="animation-delay:0.10s" x="70" y="170" width="510" height="110" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="70" y="170" width="510" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.10s" x="90" y="206" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" fill="#e9eef2" text-anchor="start" font-weight="600">a class</text><text class="in" style="animation-delay:0.10s" x="90" y="236" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">the same lab for every student</text><text class="in" style="animation-delay:0.10s" x="90" y="262" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9" text-anchor="start" font-weight="400">phases are restore points</text><rect class="in spot" style="animation-delay:0.20s" x="620" y="170" width="510" height="110" rx="8" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="620" y="170" width="510" height="4" rx="2" fill="#e8c34a"/><text class="in" style="animation-delay:0.20s" x="640" y="206" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" fill="#e9eef2" text-anchor="start" font-weight="600">a demo</text><text class="in" style="animation-delay:0.20s" x="640" y="236" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">Phase 6 built the day before</text><text class="in" style="animation-delay:0.20s" x="640" y="262" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e8c34a" text-anchor="start" font-weight="400">vCenter + VCF Operations + AD</text><rect class="in spot" style="animation-delay:0.30s" x="70" y="300" width="510" height="110" rx="8" fill="#22343c" stroke="#b58ad6" stroke-width="1.5"/><rect class="in" style="animation-delay:0.30s" x="70" y="300" width="510" height="4" rx="2" fill="#b58ad6"/><text class="in" style="animation-delay:0.30s" x="90" y="336" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" fill="#e9eef2" text-anchor="start" font-weight="600">a new release</text><text class="in" style="animation-delay:0.30s" x="90" y="366" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">side by side with the current one</text><text class="in" style="animation-delay:0.30s" x="90" y="392" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#b58ad6" text-anchor="start" font-weight="400">Release: a list on the form</text><rect class="in spot" style="animation-delay:0.40s" x="620" y="300" width="510" height="110" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.40s" x="620" y="300" width="510" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.40s" x="640" y="336" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" fill="#e9eef2" text-anchor="start" font-weight="600">a rehearsal</text><text class="in" style="animation-delay:0.40s" x="640" y="366" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">an install, offline, before the real one</text><text class="in" style="animation-delay:0.40s" x="640" y="392" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5fb84a" text-anchor="start" font-weight="400">the dark-site route, end to end</text><rect class="in spot" style="animation-delay:0.50s" x="70" y="440" width="1060" height="100" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.50s" x="70" y="440" width="1060" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.50s" x="90" y="476" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">request &#8594; build &#8594; use &#8594; delete &#8594; request again</text><text class="in" style="animation-delay:0.50s" x="90" y="510" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#49afd9" text-anchor="start" font-weight="400">students, trainers and the platform team: one catalog</text><text class="in" style="animation-delay:0.50s" x="600" y="590" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">one catalog item per phase, requested by whoever needs the lab</text></svg>