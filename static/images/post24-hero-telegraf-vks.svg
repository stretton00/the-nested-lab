c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="450" y="190" width="300" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.20s" x="470" y="226" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#e9eef2" text-anchor="start" font-weight="600">Supervisor Service</text><text class="in" style="animation-delay:0.20s" x="470" y="252" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5fb84a" text-anchor="start" font-weight="400">Supervisor Management Proxy</text><text class="in" style="animation-delay:0.20s" x="470" y="276" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fa1ad" text-anchor="start" font-weight="400">install on the supervisor,</text><text class="in" style="animation-delay:0.20s" x="470" y="296" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fa1ad" text-anchor="start" font-weight="400">not in the guest cluster</text><rect class="in spot" style="animation-delay:0.30s" x="820" y="190" width="300" height="120" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.30s" x="820" y="190" width="300" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.30s" x="840" y="226" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#e9eef2" text-anchor="start" font-weight="600">guest kube-system</text><text class="in" style="animation-delay:0.30s" x="840" y="252" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9" text-anchor="start" font-weight="400">SecretExport &#8594; SecretImport</text><text class="in" style="animation-delay:0.30s" x="840" y="276" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5fb84a" text-anchor="start" font-weight="400">secrets appear &#8594; pods Running</text><text class="in" style