<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d">
<title id="t">A subnet left behind moves every new subnet up one block</title>
<desc id="d">In a fresh VPC the lab's four subnets take the /27 blocks .0, .32, .64 and .96, and dc01's fixed address 172.30.0.34 fits sn-mgmt. Requested 11 s after the delete tool said clean, while a deleted lab's subnet still held .0/27, the new subnets take .32, .64, .96 and .128; sn-mgmt is .64/27, so NSX refuses dc01's port for 172.30.0.34.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#49afd9"/></marker>
</defs>
<rect width="1100" height="500" fill="#1b2a32"/>
<g stroke="#34495a" stroke-width="1" opacity="0.28">
<line x1="80" y1="0" x2="80" y2="500"/><line x1="160" y1="0" x2="160" y2="500"/><line x1="240" y1="0" x2="240" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/><line x1="480" y1="0" x2="480" y2="500"/><line x1="560" y1="0" x2="560" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/><line x1="720" y1="0" x2="720" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/><line x1="880" y1="0" x2="880" y2="500"/><line x1="960" y1="0" x2="960" y2="500"/><line x1="1040" y1="0" x2="1040" y2="500"/>
<line x1="0" y1="80" x2="1100" y2="80"/><line x1="0" y1="160" x2="1100" y2="160"/><line x1="0" y1="240" x2="1100" y2="240"/><line x1="0" y1="320" x2="1100" y2="320"/><line x1="0" y1="400" x2="1100" y2="400"/><line x1="0" y1="480" x2="1100" y2="480"/>
</g>
<text x="60" y="58" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#49afd9">ONE VPC &#183; 172.30.0.0/16 &#183; /27 BLOCKS IN THE ORDER THE SUBNETS ARE CREATED</text>
<text x="60" y="98" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700" fill="#e9eef2">A subnet left behind moves every new subnet up one block</text>

<!-- row labels -->
<text x="60" y="180" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">Fresh VPC</text>
<text x="60" y="202" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8fa1ad">the plan</text>
<text x="60" y="336" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">Re-request</text>
<text x="60" y="358" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8fa1ad">11 s after the</text>
<text x="60" y="377" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8fa1ad">delete tool said</text>
<text x="60" y="396" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8fa1ad">&#8220;clean&#8221;</text>

<!-- row 1: fresh VPC -->
<g font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif">
<rect x="250" y="140" width="150" height="96" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="250" y="140" width="150" height="4" rx="2" fill="#0079b8"/>
<text x="264" y="166" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">172.30.0.0/27</text>
<text x="264" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">sn-trunk</text>
<text x="264" y="211" font-size="13.5" fill="#8fa1ad">the hosts&#8217; vNICs</text>

<rect x="412" y="140" width="150" height="96" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="412" y="140" width="150" height="4" rx="2" fill="#5fb84a"/>
<text x="426" y="166" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">172.30.0.32/27</text>
<text x="426" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">sn-mgmt</text>
<text x="426" y="211" font-size="13.5" fill="#8fa1ad">dc01 .34 &#183; jump .35</text>
<text x="426" y="228" font-size="13.5" font-weight="600" fill="#5fb84a">fit</text>

<rect x="574" y="140" width="150" height="96" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="574" y="140" width="150" height="4" rx="2" fill="#0079b8"/>
<text x="588" y="166" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">172.30.0.64/27</text>
<text x="588" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">sn-vmotion</text>
<text x="588" y="211" font-size="13.5" fill="#8fa1ad">VLAN 1611</text>

<rect x="736" y="140" width="150" height="96" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="736" y="140" width="150" height="4" rx="2" fill="#0079b8"/>
<text x="750" y="166" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">172.30.0.96/27</text>
<text x="750" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">sn-vsan</text>
<text x="750" y="211" font-size="13.5" fill="#8fa1ad">VLAN 1612</text>

<rect x="898" y="140" width="150" height="96" rx="8" fill="#1b2a32" stroke="#34495a" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="912" y="166" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#8fa1ad">172.30.0.128/27</text>
<text x="912" y="190" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" fill="#8fa1ad">free</text>
</g>

<!-- the shift -->
<g stroke="#49afd9" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ah)">
<line x1="325" y1="240" x2="483" y2="294"/>
<line x1="487" y1="240" x2="645" y2="294"/>
<line x1="649" y1="240" x2="807" y2="294"/>
<line x1="811" y1="240" x2="969" y2="294"/>
</g>

