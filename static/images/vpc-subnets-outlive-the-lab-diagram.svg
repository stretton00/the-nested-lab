<g font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif">
<rect x="250" y="300" width="150" height="96" rx="8" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><rect x="250" y="300" width="150" height="4" rx="2" fill="#e8c34a"/>
<text x="264" y="326" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">172.30.0.0/27</text>
<text x="264" y="350" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e8c34a">still in NSX</text>
<text x="264" y="371" font-size="13.5" fill="#8fa1ad">a deleted lab&#8217;s</text>
<text x="264" y="388" font-size="13.5" fill="#8fa1ad">subnet</text>

<rect x="412" y="300" width="150" height="96" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="412" y="300" width="150" height="4" rx="2" fill="#0079b8"/>
<text x="426" y="326" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">172.30.0.32/27</text>
<text x="426" y="350" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">sn-trunk</text>
<text x="426" y="371" font-size="13.5" fill="#8fa1ad">hosts power on</text>

<rect x="574" y="300" width="150" height="96" rx="8" fill="#22343c" stroke="#e5605a" stroke-width="1.5"/><rect x="574" y="300" width="150" height="4" rx="2" fill="#e5605a"/>
<text x="588" y="326" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">172.30.0.64/27</text>
<text x="588" y="350" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">sn-mgmt</text>
<text x="588" y="371" font-size="13.5" fill="#8fa1ad">dc01 asks for .34</text>
<text x="588" y="388" font-size="13.5" font-weight="600" fill="#e5605a">port refused</text>

<rect x="736" y="300" width="150" height="96" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="736" y="300" width="150" height="4" rx="2" fill="#0079b8"/>
<text x="750" y="326" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">172.30.0.96/27</text>
<text x="750" y="350" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">sn-vmotion</text>

<rect x="898" y="300" width="150" height="96" rx="8" fill="#22343c" stroke="#34495a" stroke-width="1.5"/><rect x="898" y="300" width="150" height="4" rx="2" fill="#0079b8"/>
<text x="912" y="326" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#49afd9">172.30.0.128/27</text>
<text x="912" y="350" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e9eef2">sn-vsan</text>
</g>

<text x="60" y="444" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#e5605a">IP Address 172.30.0.34 does not belong to any of the existing ranges</text>
<text x="60" y="472" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#8fa1ad">dc01 and the jump host never power on. Request again only when NSX shows no subnets in the VPC.</text>
</svg>
