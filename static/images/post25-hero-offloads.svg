<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style><rect width="1200" height="630" fill="#1b2a32"/><g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/></g><text class="in" style="animation-delay:0.00s" x="600" y="64" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e5605a" text-anchor="middle" font-weight="600" letter-spacing="3">PING WORKS &#183; TCP DIES</text><text class="in" style="animation-delay:0.00s" x="600" y="116" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="40" fill="#e9eef2" text-anchor="middle" font-weight="700">Two offloads, one stall</text><rect class="in spot" style="animation-delay:0.10s" x="70" y="180" width="300" height="160" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/><rect class="in" style="animation-delay:0.10s" x="70" y="180" width="300" height="4" rx="2" fill="#49afd9"/><text class="in" style="animation-delay:0.10s" x="90" y="216" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">nested ESXi (sender)</text><text class="in" style="animation-delay:0.10s" x="90" y="244" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">nvmxnet3_ens &#183; Auto</text><text class="in blink" style="animation-delay:0.10s" x="90" y="272" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e5605a" text-anchor="start" font-weight="400">GENEVE_OFFLOAD + TSO256k</text><text class="in" style="animation-delay:0.10s" x="90" y="300" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fa1ad" text-anchor="start" font-weight="400">hands down 64 KB frames</text><rect class="in spot" style="animation-delay:0.20s" x="450" y="180" width="300" height="160" rx="8" fill="#22343c" stroke="#e8c34a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.20s" x="450" y="180" width="300" height="4" rx="2" fill="#e8c34a"/><text class="in" style="animation-delay:0.20s" x="470" y="216" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">outer vSphere layer</text><text class="in" style="animation-delay:0.20s" x="470" y="244" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#8fa1ad" text-anchor="start" font-weight="400">vmxnet3 &#8594; vDS &#8594; bnxtnet</text><text class="in" style="animation-delay:0.20s" x="470" y="272" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e8c34a" text-anchor="start" font-weight="400">Vmxnet3HwLRO=1</text><text class="in" style="animation-delay:0.20s" x="470" y="300" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fa1ad" text-anchor="start" font-weight="400">merges TCP into big frames</text><rect class="in spot" style="animation-delay:0.30s" x="830" y="180" width="300" height="160" rx="8" fill="#22343c" stroke="#b58ad6" stroke-width="1.5"/><rect class="in" style="animation-delay:0.30s" x="830" y="180" width="300" height="4" rx="2" fill="#b58ad6"/><text class="in" style="animation-delay:0.30s" x="850" y="216" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#e9eef2" text-anchor="start" font-weight="600">nested ESXi (receiver)</text><text class="in blink" style="animation-delay:0.30s" x="850" y="244" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e5605a" text-anchor="start" font-weight="400">pkts rx err     +267</text><text class="in" style="animation-delay:0.30s" x="850" y="272" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e8c34a" text-anchor="start" font-weight="400">outer port drop  267</text><text class="in" style="animation-delay:0.30s" x="850" y="300" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fa1ad" text-anchor="start" font-weight="400">one for one, every run</text><line class="in" style="animation-delay:0.30s" x1="370" y1="260" x2="450" y2="260" stroke="#e5605a" stroke-width="3" stroke-dasharray="8 6"/><g class="in" style="animation-delay:0.30s"><circle r="3" fill="#e5605a"><animateMotion dur="0.90s" begin="0.30s" repeatCount="indefinite" path="M 370 260 L 450 260"/></circle></g><line class="in blink" style="animation-delay:0.30s" x1="398" y1="248" x2="422" y2="272" stroke="#e5605a" stroke-width="5"/><line class="in blink" style="animation-delay:0.30s" x1="422" y1="248" x2="398" y2="272" stroke="#e5605a" stroke-width="5"/><line class="in" style="animation-delay:0.30s" x1="750" y1="260" x2="830" y2="260" stroke="#e5605a" stroke-width="3" stroke-dasharray="8 6"/><g class="in" style="animation-delay:0.30s"><circle r="3" fill="#e5605a"><animateMotion dur="0.90s" begin="0.30s" repeatCount="indefinite" path="M 750 260 L 830 260"/></circle></g><line class="in blink" style="animation-delay:0.30s" x1="778" y1="248" x2="802" y2="272" stroke="#e5605a" stroke-width="5"/><line class="in blink" style="animation-delay:0.30s" x1="802" y1="248" x2="778" y2="272" stroke="#e5605a" stroke-width="5"/><rect class="in spot" style="animation-delay:0.40s" x="70" y="390" width="1060" height="150" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/><rect class="in" style="animation-delay:0.40s" x="70" y="390" width="1060" height="4" rx="2" fill="#5fb84a"/><text class="in" style="animation-delay:0.40s" x="90" y="428" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#e9eef2" text-anchor="start" font-weight="600">both vmxnet3 drivers, every nested host, then reboot</text><text class="in pulse" style="animation-delay:0.40s" x="90" y="462" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="17" fill="#5fb84a" text-anchor="start" font-weight="700">encapOffload=0  rxInnerOffload=0  disableLRO=1</text><text class="in" style="animation-delay:0.40s" x="90" y="500" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14" fill="#49afd9" text-anchor="start" font-weight="400">7.4 &#8594; 178.8 MB/s  &#183;  rx err 0 in 16,382,394 packets</text><text class="in" style="animation-delay:0.40s" x="600" y="590" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#8fa1ad" text-anchor="middle" font-weight="400">count drops at both ends of the hop &#8212; don&#8217;t just time the transfer</text></svg>