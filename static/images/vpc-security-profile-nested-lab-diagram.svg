<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"><style>@keyframes nl-in{0%{opacity:0}3%{opacity:1}84%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes nl-spot{0%,30%{stroke-width:1.5}33%{stroke-width:6}39%{stroke-width:1.5}100%{stroke-width:1.5}}@keyframes nl-flow{to{stroke-dashoffset:-40}}@keyframes nl-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes nl-blink{0%,100%{opacity:1}50%{opacity:.15}}@keyframes nl-glow{0%,100%{stroke-width:1.5}50%{stroke-width:4.5}}.in{opacity:0;animation:nl-in 12s ease-out infinite}.in.spot{animation:nl-in 12s ease-out infinite,nl-spot 12s ease-in-out infinite}.in.flow{stroke-dasharray:12 8;animation:nl-in 12s ease-out infinite,nl-flow 1.2s linear infinite}.in.pulse{animation:nl-in 12s ease-out infinite,nl-pulse 2s ease-in-out infinite}.in.blink{animation:nl-in 12s ease-out infinite,nl-blink 1.2s ease-in-out infinite}.in.glow{animation:nl-in 12s ease-out infinite,nl-glow 2.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.in,.in.spot,.in.flow,.in.pulse,.in.blink,.in.glow{opacity:1;animation:none}animateMotion{display:none}}</style>
<rect width="1200" height="600" fill="#1b2a32"/>
<g stroke="#34495a" stroke-width="1" opacity="0.28"><line x1="0" y1="0" x2="0" y2="600"/><line x1="80" y1="0" x2="80" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/><line x1="560" y1="0" x2="560" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/><line x1="800" y1="0" x2="800" y2="600"/><line x1="880" y1="0" x2="880" y2="600"/><line x1="960" y1="0" x2="960" y2="600"/><line x1="1040" y1="0" x2="1040" y2="600"/><line x1="1120" y1="0" x2="1120" y2="600"/><line x1="1200" y1="0" x2="1200" y2="600"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/></g>
<text class="in" style="animation-delay:0.00s" x="60" y="56" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8c34a" font-weight="600" letter-spacing="3">ISOLATION WITH ESSENTIAL SERVICES &#183; WHO THE POLICY SEES</text>
<text class="in" style="animation-delay:0.00s" x="60" y="96" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="26" fill="#f4f6f8" font-weight="700">The policy knows VM ports. A nested lab lives behind them.</text>
<rect class="in" style="animation-delay:0.05s" x="40" y="124" width="770" height="372" rx="12" fill="none" stroke="#49afd9" stroke-width="1.5" stroke-dasharray="7 6"/>
<text class="in" style="animation-delay:0.05s" x="62" y="152" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#49afd9" font-weight="600">vpc-student03 &#183; the lab&#8217;s VPC</text>
<rect class="in spot" style="animation-delay:0.10s" x="62" y="172" width="318" height="178" rx="8" fill="#22343c" stroke="#5fb84a" stroke-width="1.5"/>
<rect class="in" style="animation-delay:0.10s" x="62" y="172" width="318" height="4" rx="2" fill="#5fb84a"/>
<text class="in" style="animation-delay:0.10s" x="82" y="206" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="16" fill="#f4f6f8" font-weight="600">In the group: VM port addresses</text>
<text class="in" style="animation-delay:0.10s" x="82" y="242" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#5fb84a">16 trunk ports<tspan x="222">172.30.0.2 - .17</tspan></text>
<text class="in" style="animation-delay:0.10s" x="82" y="270" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#5fb84a">dc01<tspan x="222">172.30.0.34</tspan></text>
<text class="in" style="animation-delay:0.10s" x="82" y="298" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#5fb84a">jump host<tspan x="222">172.30.0.35</tspan></text>
<text class="in" style="animation-delay:0.10s" x="82" y="330" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#8fa1ad">the addresses NSX allocated to ports</text>
<rect class="in spot" style="animation-delay:0.20s" x="470" y="172" width="318" height="178" rx="8" fill="#22343c" stroke="#e5605a" stroke-width="1.5"/>
<rect class="in" style="animation-delay:0.20s" x="470" y="172" width="318" height="4" rx="2" fill="#e5605a"/>
<text class="in" style="animation-delay:0.20s" x="490" y="206" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#f4f6f8" font-weight="600">Behind the trunk ports: not in it</text>
<text class="in" style="animation-delay:0.20s" x="490" y="242" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e5605a">esx01-04 vmk0<tspan x="614">172.30.0.40 - .43</tspan></text>
<text class="in" style="animation-delay:0.20s" x="490" y="270" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e5605a">vMotion, vSAN<tspan x="614">.70-.73, .100-.103</tspan></text>
<text class="in" style="animation-delay:0.20s" x="490" y="298" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#e5605a">vCenter, Ops<tspan x="614">172.30.0.50, .51</tspan></text>
<text class="in" style="animation-delay:0.20s" x="490" y="330" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#e5605a">host &#8596; host: neither end in the group</text>
<text class="in" style="animation-delay:0.30s" x="425" y="230" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#e5605a" text-anchor="middle" font-weight="600">Deny-All</text>
<line class="in flow" style="animation-delay:0.30s" x1="380" y1="252" x2="462" y2="252" stroke="#e5605a" stroke-width="3"/>
<polygon class="in" style="animation-delay:0.30s" points="470,252 460,246 460,258" fill="#e5605a"/>
<g class="in" style="animation-delay:0.30s"><circle r="3" fill="#e5605a"><animateMotion dur="0.90s" begin="0.30s" repeatCount="indefinite" path="M 380 252 L 462 252"/></circle></g>
<line class="in blink" style="animation-delay:0.30s" x1="414" y1="241" x2="436" y2="263" stroke="#e5605a" stroke-width="5"/>
<line class="in blink" style="animation-delay:0.30s" x1="436" y1="241" x2="414" y2="263" stroke="#e5605a" stroke-width="5"/>
<rect class="in spot" style="animation-delay:0.40s" x="62" y="376" width="726" height="96" rx="8" fill="#22343c" stroke="#49afd9" stroke-width="1.5"/>
<rect class="in" style="animation-delay:0.40s" x="62" y="376" width="726" height="4" rx="2" fill="#49afd9"/>
<text class="in" style="animation-delay:0.40s" x="82" y="408" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#f4f6f8" font-weight="600">What still passes the first rule</text>
<text class="in pulse" style="animation-delay:0.40s" x="82" y="444" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#49afd9">DNS, DHCP, NTP, ICMP: from anywhere, on to the Application category</text>
<rect class="in spot" style="animation-delay:0.50s" x="850" y="172" width="310" height="134" rx="8" fill="#22343c" stroke="#b58ad6" stroke-width="1.5"/>
<rect class="in" style="animation-delay:0.50s" x="850" y="172" width="310" height="4" rx="2" fill="#b58ad6"/>
<text class="in" style="animation-delay:0.50s" x="870" y="206" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#f4f6f8" font-weight="600">shared-svc: binaries server</text>
<text class="in" style="animation-delay:0.50s" x="870" y="238" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#8fa1ad">HTTP and NFS, over the transit gateway</text>
<text class="in" style="animation-delay:0.50s" x="870" y="266" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#e5605a">dropped leaving the lab, and again</text>
<text class="in" style="animation-delay:0.50s" x="870" y="288" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#e5605a">by shared-svc&#8217;s own policy on arrival</text>
<line class="in flow" style="animation-delay:0.55s" x1="792" y1="238" x2="842" y2="238" stroke="#e5605a" stroke-width="3"/>
<polygon class="in" style="animation-delay:0.55s" points="850,238 840,232 840,244" fill="#e5605a"/>
<line class="in blink" style="animation-delay:0.55s" x1="811" y1="228" x2="831" y2="248" stroke="#e5605a" stroke-width="5"/>
<line class="in blink" style="animation-delay:0.55s" x1="831" y1="228" x2="811" y2="248" stroke="#e5605a" stroke-width="5"/>
<rect class="in spot" style="animation-delay:0.60s" x="850" y="330" width="310" height="142" rx="8" fill="#22343c" stroke="#b58ad6" stroke-width="1.5"/>
<rect class="in" style="animation-delay:0.60s" x="850" y="330" width="310" height="4" rx="2" fill="#b58ad6"/>
<text class="in" style="animation-delay:0.60s" x="870" y="364" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#f4f6f8" font-weight="600">VPC load balancer: RDP address</text>
<text class="in" style="animation-delay:0.60s" x="870" y="396" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#8fa1ad">the classroom to the jump host, TCP 3389</text>
<text class="in" style="animation-delay:0.60s" x="870" y="424" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#e8c34a">very likely dropped: its address</text>
<text class="in" style="animation-delay:0.60s" x="870" y="446" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#e8c34a">is not in the group either</text>
<line class="in flow" style="animation-delay:0.65s" x1="850" y1="404" x2="800" y2="404" stroke="#e8c34a" stroke-width="3"/>
<polygon class="in" style="animation-delay:0.65s" points="792,404 802,398 802,410" fill="#e8c34a"/>
<circle class="in pulse" style="animation-delay:0.65s" cx="822" cy="404" r="11" fill="#1b2a32" stroke="#e8c34a" stroke-width="2"/>
<text class="in pulse" style="animation-delay:0.65s" x="822" y="409" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="14" fill="#e8c34a" text-anchor="middle" font-weight="700">?</text>
<text class="in" style="animation-delay:0.70s" x="600" y="534" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="15" fill="#8fa1ad" text-anchor="middle">Allow-within-VPC needs both ends in the group. Everything else except DNS, DHCP, NTP and ICMP meets Deny-All.</text>
<text class="in" style="animation-delay:0.70s" x="600" y="562" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#8fa1ad" text-anchor="middle">Read from the policy&#8217;s rules and its group on f06. Our hosts do not enforce the distributed firewall, so nothing here was dropped.</text>
